whatIsIt = Über Obidos
aboutObidos = <div class="row"> \
<div class="col-md-12 col-xs-12 col-centered"> \
	<ul class="list-group"> \
		<li class="list-group-item">\
			&#8226; <a href="https://spenego.com">Obidos von Spenego</a> \
			bietet eine Möglichkeit, sensible Informationen (z.B. Passwörter, Kreditkarteninformationen usw.) <b>sicher zu speichern</b> \
			und die Informationen <b>sicher zu teilen</b>. Alle Informationen werden \
			mit den besten Kryptobibliotheken verschlüsselt.<br/></li>\
		<li class="list-group-item">\
			&#8226; Informationen können mit einem einzelnen Benutzer oder einer Gruppe geteilt werden. \
			Verschiedene Arten von Informationen können in einem <span style="font-weight:bold;">Container</span> abgelegt \
			und der Container kann ebenfalls geteilt werden. \
			Der Besitzer der Informationen kann die Eigentümerschaft an andere Benutzer delegieren. \
			Der Besitzer kann auch die Freigabe widerrufen. \
			Die geteilten Informationen können eine optionale Lebensdauer haben. </li> \
		<li class="list-group-item">\
			&#8226; Obidos-Administratoren haben keinen Zugriff auf Benutzerschlüssel oder verschlüsselte Daten. Admins können  \
			nur Benutzerkonten verwalten. \
			</li> \
	</ul> \
</div>  \
</div> \

