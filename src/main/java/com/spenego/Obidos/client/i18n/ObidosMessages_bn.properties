<li><b>HTML বার্তা</b> টেক্সটক্ষেত্রের টেক্সট প্রতিক্রিয়াশীল HTML সংযুক্তিতে প্রধান বার্তা হিসেবে ব্যবহৃত হবে। তবে, নিরাপত্তার কারণে \
বার্তায় কোনো HTML ট্যাগ ব্যবহার করবেন না কারণ সেগুলি এস্কেপ করা হবে।</li> \
<li><b>বোতাম শিরোনাম</b> টেক্সটবক্সের টেক্সট প্রতিক্রিয়াশীল HTML মেইলে বোতামের শিরোনাম হিসেবে প্রদর্শিত হবে</li> \
<li><b>সহায়তা</b> টেক্সটক্ষেত্র HTML-ভিত্তিক মেইল রিডারের জন্য সহায়তা টেক্সট যদি বোতামে ক্লিক করতে সমস্যা হয়</li> \
<li><b>টেক্সট বার্তা</b> টেক্সটক্ষেত্রের টেক্সট টেক্সট-ভিত্তিক মেইল রিডারের জন্য টেক্সট সংযুক্তিতে ব্যবহৃত হবে</li> \
<li><b>যোগাযোগ</b> টেক্সটক্ষেত্র ব্যবহারকারীকে কীভাবে প্রযুক্তিগত সহায়তা ইত্যাদির সাথে যোগাযোগ করতে হবে তা জানানোর জন্য</li> \
