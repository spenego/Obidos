listPersonalTemplatesHelp=<ul style="padding-left:2px"> \
<li>টেমপ্লেটের ক্ষেত্রগুলি দেখতে, <span style="font-weight:bold;">টেমপ্লেট নাম</span>-এর অধীনে এর নামে ক্লিক করুন। \
<i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> সম্পাদনা</span> ব্যবহার করে একটি টেমপ্লেটের নাম বা ক্ষেত্র বা ক্ষেত্রগুলির প্রদর্শন ক্রম পরিবর্তন করা যেতে পারে।</li>\
<li><i class="fa fa-copy" style="color:#F65D3C"></i><span style="color: #1E8CFF;"> কপি</span> ব্যবহার করে আরও পরিবর্তন বা অভিযোজনের জন্য একটি টেমপ্লেট কপি করা যেতে পারে। \
একটি টেমপ্লেট মুছে ফেলতে, এটি নির্বাচন করুন এবং <i class="fa fa-times-circle" style="color:red"></i><span style="border-radius:3px;color:#ff0000;font-weight:bold;">&nbsp;মুছুন</span> ক্লিক করুন।</li> \
<li>যখন একটি টেমপ্লেট মুছে ফেলা হয়, সেই টেমপ্লেট ব্যবহার করে তৈরি করা বিদ্যমান আইটেমগুলি সংরক্ষিত থাকে। টেমপ্লেটটি নিজেই পরবর্তী ব্যবহার থেকে সরানো হবে।</li></ul>

