লক আইকন <i class="fa fa-lock" style="color:green"></i> দিয়ে চিহ্নিত ক্ষেত্রগুলি এনক্রিপ্ট করে রাখা হয় এবং সার্চে ব্যবহার করা যায় না</li> \
<li>যদি কন্টেইনারটি শেয়ারযোগ্য ধরনের হয়, তাহলে এতে সংরক্ষিত একটি আইটেম শেয়ারযোগ্য বা ব্যক্তিগত হতে পারে। </li> \
<li><font color="red">এই কন্টেইনারটি শেয়ারযোগ্য। সাবধানে সিদ্ধান্ত নিন যে আইটেমটি শেয়ার করা যাবে কি না।</font></li> \
<li>যদি একটি আইটেম শেয়ারযোগ্য হয়, তাহলে শেয়ার করার জন্য একটি মেয়াদ শেষের দিন নির্দিষ্ট করা যেতে পারে। এর মানে হল, যদি একটি মেয়াদ শেষের দিন সেট করা হয়, \
তাহলে নির্দিষ্ট দিনের পর আইটেমটি প্রাপকের তালিকা থেকে অদৃশ্য হয়ে যাবে। \
যদি কোনও <span style="font-weight: bold;">শেয়ার মেয়াদ শেষ</span> সেট না করা হয়, তাহলে আইটেমটির কোনও মেয়াদ শেষ হবে না। \
মেয়াদ শেষের দিনগুলি কেবল তখনই কার্যকর হবে যখন আইটেমটি কারও সাথে শেয়ার করা হবে।</li></ul>

addItemToPrivateContainerHelp=<ul style="padding-left:2px"><li>আনলক আইকন <i class="fa fa-unlock" style="color:red"></i> সহ ক্ষেত্রগুলি সাধারণ টেক্সট আকারে সংরক্ষিত হয়। \
লক আইকন <i class="fa fa-lock" style="color:green"></i> সহ ক্ষেত্রগুলি এনক্রিপ্ট করে রাখা হয় এবং সার্চে ব্যবহার করা যায় না।</li> \
