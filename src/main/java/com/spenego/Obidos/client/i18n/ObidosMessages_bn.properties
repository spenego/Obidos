createAdminHelp = <ul style="padding-left:2px"> \
<li>ব্যবহারকারীর নামে বড় হাতের অক্ষর, ছোট হাতের অক্ষর, সংখ্যা, _, - এবং . থাকতে পারে।</li> \
<li>প্রতিটি অ্যাডমিন ''সেটিংস'' মেনুর অধীনে সমস্ত কার্যক্রম সম্পাদন করতে সক্ষম হবেন। একইভাবে প্রতিটি অ্যাডমিন একজন ব্যবহারকারী বা অ্যাডমিনের প্রোফাইল তথ্য পরিবর্তন করতে সক্ষম হবেন। তবে, একজন ব্যবহারকারী বা অ্যাডমিনের ক্রেডেনশিয়াল (ব্যবহারকারীর নাম, পাসওয়ার্ড, 2FA) পরিবর্তন করার জন্য ''ক্রেডেনশিয়াল পরিবর্তন'' ক্ষমতার প্রয়োজন।</li> \
<li> একজন <span style="font-weight:bold">রুট অ্যাডমিন</span> হলেন \
এক বিশেষ ধরনের অ্যাডমিন যার ব্যবহারকারী এবং অ্যাডমিন অ্যাকাউন্ট পরিচালনা করার জন্য সম্পূর্ণ ক্ষমতা রয়েছে। শুধুমাত্র একজন <span style="font-weight:bold">রুট অ্যাডমিন</span> নতুন \
অ্যাডমিন অ্যাকাউন্টের জন্য সমস্ত ক্ষমতা পরিচালনা করতে পারেন বা অন্য একজন <span style="font-weight:bold">রুট অ্যাডমিন</span> অ্যাকাউন্ট তৈরি করতে পারেন। \
&#8220;নতুন অ্যাডমিনের ক্ষমতা&#8221;-এর অধীনে সমস্ত ক্ষমতা চালু করলেই একজন অ্যাডমিনকে \
<span style="font-weight:bold">রুট অ্যাডমিন</span> করে না। </li> \
<li>একটি <span style="font-weight:bold">রুট অ্যাডমিন</span> অ্যাকাউন্ট তৈরি করতে, \
<span style="font-weight:bold">রুট অ্যাডমিন হিসেবে তৈরি করুন</span> মান চালু করুন। </li> \
</ul>

