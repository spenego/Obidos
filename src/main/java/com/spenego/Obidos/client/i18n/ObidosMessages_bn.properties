groupsMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">গ্রুপ</font></b></div></p> \
<p>ব্যবহারকারীরা ব্যবহারকারীদের গ্রুপ তৈরি করতে পারেন। গ্রুপ একাধিক ব্যবহারকারীর সাথে একটি নোট বা আইটেম/কন্টেইনার শেয়ার করা সহজ করে তুলবে। \
শুধুমাত্র ব্যবহারকারীদের একটি গ্রুপের সদস্য হিসাবে যোগ করা যেতে পারে। অন্য একটি গ্রুপকে একটি গ্রুপের সদস্য হিসাবে যোগ করা যাবে না। </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">নতুন গ্রুপ তৈরি করুন</font></b></span></p> \
<p><b><font color="blue">নতুন গ্রুপ তৈরি করুন</font></b> মেনু ব্যবহারকারীদের একটি নতুন গ্রুপ তৈরি করতে ব্যবহৃত হয়। গ্রুপটিকে একটি নাম দেওয়া যেতে পারে। \
এই নামটি ব্যবহারকারীর মালিকানাধীন সমস্ত গ্রুপের সংগ্রহ থেকে একটি নির্দিষ্ট গ্রুপ খুঁজে পেতে অনুসন্ধানে ব্যবহার করা যেতে পারে। </p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">আমার গ্রুপ</font></b></span></p> \
<p><b><font color="blue">আমার গ্রুপ</font></b> মেনু ব্যবহারকারীর মালিকানাধীন সমস্ত গ্রুপের একটি তালিকা পেতে ব্যবহৃত হয়। \
গ্রুপগুলি যে ক্রমে তৈরি করা হয়েছিল সেই ক্রমে প্রদর্শিত হবে, সর্বশেষটি উপরে থাকবে। \
স্ক্রিনের নীচে দেখানো হবে যে কতগুলি গ্রুপ বিদ্যমান। \
উদাহরণস্বরূপ যদি 17টি গ্রুপ থাকে এবং স্ক্রিনে 14টি তালিকাভুক্ত হয়, আপনি দেখবেন \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> 17টির মধ্যে 1-14 <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
<p>তালিকায় একবারে একটি করে এগিয়ে যেতে, <img src="/images/simplePagerNextPage.png"> এ ক্লিক করুন। \
গ্রুপের একটি সম্পূর্ণ পৃষ্ঠা এগিয়ে যেতে, <img src="/images/simplePagerLastPage.png"> এ ক্লিক করুন। \
একইভাবে, তালিকায় একবারে একটি গ্রুপ পিছনে যেতে, <img src="/images/simplePagerPreviousPage.png"> এ ক্লিক করুন \
এবং গ্রুপের একটি সম্পূর্ণ পৃষ্ঠা পিছনে যেতে, <img src="/images/simplePagerFirstPage.png"> এ ক্লিক করুন। </p> \
</span>

