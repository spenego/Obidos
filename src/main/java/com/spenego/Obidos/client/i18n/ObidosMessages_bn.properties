notificationMessagesHelp=<ul style="padding-left:2px"> \
<li>সর্বশেষ বার্তাগুলি উপরে প্রদর্শিত হয়। একটি বার্তা শেয়ার করা আর্টিফ্যাক্ট বা প্রত্যাহার/মুছে ফেলা আর্টিফ্যাক্টের সাথে সম্পর্কিত হতে পারে।</li> \
<li>প্রত্যাহার/মুছে ফেলা আর্টিফ্যাক্টের সাথে সম্পর্কিত বার্তা শুধুমাত্র তথ্যমূলক। এগুলি ক্লিকযোগ্য লিঙ্ক নয়। </li> \
<li>শেয়ারিং সম্পর্কিত বার্তাগুলি ক্লিকযোগ্য। \
আপনার সাথে শেয়ার করা আইটেম/নোট দেখতে, বার্তা ক্ষেত্রে ক্লিক করুন। </li>\
<li>বার্তা মুছতে, আগ্রহের বার্তাগুলি নির্বাচন করুন এবং \
<i class="fa fa-times-circle" style="color:red"></i><span style="border-radius:3px;color:#ff0000;font-weight:bold;">&nbsp;মুছুন</span> এ ক্লিক করুন। \
বার্তাগুলিকে পঠিত হিসাবে চিহ্নিত করতে, প্রাসঙ্গিক বার্তাগুলি নির্বাচন করুন এবং <i class="fa fa-check" style="color:#3874de;"></i><span style="font-weight:bold;color:#3874de;">&nbsp;পঠিত হিসাবে চিহ্নিত করুন</span> এ ক্লিক করুন।</li> \
</ul>

actionHistoryHelp=<ul style="padding-left:2px"> \
<li>আপনার কার্যকলাপের ইতিহাস দেখতে, আগ্রহের আর্টিফ্যাক্টগুলি নির্বাচন করুন। </li> \
<li>আপনি কার্যকলাপগুলি ঘটেছে এমন সময়কাল সেট করতে পারেন। </li> \
<li>তারিখ এবং সময় নির্বাচন করতে, ক্যালেন্ডার পপ আপ করতে টেক্সট ফিল্ডে <b>ক্লিক</b> করুন, তারপর দিন নির্বাচন করতে <b>ক্লিক</b> করুন \
এবং তারপর সময় নির্বাচন করতে <b>ক্লিক</b> করুন এবং তারপর প্রয়োজনে মিনিট দ্বারা সময় নির্বাচন করতে <b>ক্লিক</b> করুন। \
অনুগ্রহ করে মনে রাখবেন: <b>তারিখ এবং সময় নির্বাচন সম্পূর্ণ করতে 3টি ক্লিক (দিন, সময়, সময়ের ভগ্নাংশ) অবশ্যই সম্পন্ন করতে হবে</b>।</li> \
<li>তারিখ ডায়ালগ আবার পপ আপ করতে, <b>প্রথমে বাইরে ক্লিক করে লুকান</b> এবং তারপর আবার দেখাতে টেক্সট ফিল্ডে ক্লিক করুন।</li>
</ul>

tombstonedHelp = <ul style="padding-left:2px">\
<li>টুমস্টোনড ব্যবহারকারী বা প্রশাসকরা আর সিস্টেমে লগইন করতে পারবেন না, এবং সেই অ্যাকাউন্টগুলি পুনরুদ্ধার করা যাবে না। \
এগুলি শুধুমাত্র রিপোর্টিং এবং অডিটিং উদ্দেশ্যে রাখা হয়।</li> \
<li>যখন ব্যবহারকারীদের টুমস্টোন করা হয়, অন্যদের সাথে শেয়ার করা যেকোনো আর্টিফ্যাক্ট শেয়ার করা অব্যাহত থাকবে। কারও সাথে শেয়ার না করা কন্টেইনার, আইটেম এবং নোটগুলি মুছে ফেলা হয়। </li>\
<li>একজন টুমস্টোনড ব্যবহারকারী/প্রশাসকের ব্যবহারকারীনাম পুনরায় ব্যবহার করা যেতে পারে। তবে, ইমেল ঠিকানা পুনরায় ব্যবহার করা যাবে না।</li> \
</ul>

lockedHelp = <ul style="padding-left:2px">\
<li>একজন লক করা ব্যবহারকারী/প্রশাসক সিস্টেমে লগইন করতে পারবেন না। একজন লক করা ব্যবহারকারীর সমস্ত ব্যক্তিগত তথ্য এনক্রিপ্টেড থাকবে এবং অন্য কারও দ্বারা অ্যাক্সেসযোগ্য হবে না।</li> \
<li>একজন লক করা ব্যবহারকারী/প্রশাসকের ব্যবহারকারীনাম বা ইমেল ঠিকানা একজন নতুন ব্যবহারকারীকে বরাদ্দ করা যাবে না। একবার আনলক করা হলে, ব্যবহারকারী/প্রশাসক সিস্টেমে পুনরায় অ্যাক্সেস পাবেন। </li>\
<li>লক করা ব্যবহারকারী/প্রশাসকদের একজন প্রশাসক দ্বারা আনলক করা যেতে পারে যার এটি করার ক্ষমতা রয়েছে। একজন ব্যবহারকারী/প্রশাসককে আনলক করতে অ্যাকাউন্টটি নির্বাচন করুন এবং সংশ্লিষ্ট <span style="background-color:#00b300;color:#ffffff;font-weight:bold;border-radius:3px;">&nbsp;আনলক করুন&nbsp;</span> বাটনে ক্লিক করুন।</li>\
</ul>

