<p>তালিকায় একবারে একটি করে এগিয়ে যেতে, <img src="/images/simplePagerNextPage.png"> এ ক্লিক করুন। \
টেমপ্লেটের একটি সম্পূর্ণ পৃষ্ঠা এগিয়ে যেতে, <img src="/images/simplePagerLastPage.png"> এ ক্লিক করুন। \
একইভাবে, তালিকায় একবারে একটি টেমপ্লেট পিছনে যেতে, <img src="/images/simplePagerPreviousPage.png"> এ ক্লিক করুন \
এবং টেমপ্লেটের একটি সম্পূর্ণ পৃষ্ঠা পিছনে যেতে, <img src="/images/simplePagerFirstPage.png"> এ ক্লিক করুন। </p> \
