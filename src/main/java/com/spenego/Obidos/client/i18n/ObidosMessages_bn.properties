containersMenuHelpTitle=কন্টেইনারসমূহ
containersMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">কন্টেইনারসমূহ</font></b></div></p> \
<p>একটি কন্টেইনারে আইটেম রাখা হয়। একটি কন্টেইনার ব্যক্তিগত বা শেয়ারযোগ্য হতে পারে। শুধুমাত্র ব্যক্তিগত আইটেমগুলি একটি ব্যক্তিগত কন্টেইনারে সংরক্ষণ করা যায়। \
একটি ব্যক্তিগত কন্টেইনারের আইটেমগুলি অন্য ব্যবহারকারীদের কাছ থেকে লুকানো থাকে। \
একটি শেয়ারযোগ্য কন্টেইনারে ব্যক্তিগত এবং শেয়ারযোগ্য উভয় আইটেম থাকতে পারে। \
যখন একটি শেয়ারযোগ্য কন্টেইনার অন্যদের সাথে শেয়ার করা হয়, তখন শুধুমাত্র কন্টেইনারের শেয়ারযোগ্য আইটেমগুলি তাদের কাছে দৃশ্যমান হবে। \
<p>প্রতিটি স্ক্রিনে স্ক্রিন-নির্দিষ্ট সাহায্য রয়েছে যা প্যানেলের উপরের ডান দিকে <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-info-circle" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;সাহায্য&nbsp</span></span> বোতামে ক্লিক করে অ্যাক্সেস করা যায়। \
একবার আপনি একটি নিম্ন স্তরের স্ক্রিনে নেভিগেট করলে, পূর্ববর্তী স্ক্রিনে ফিরে যেতে, প্যানেলের উপরের বাম দিকে <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-arrow-circle-left" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;পিছনে&nbsp</span></span> বোতাম ব্যবহার করুন। </p>\
<p>তালিকা মেনুগুলির মধ্যে নেভিগেশন একই রকম এবং এখানে বর্ণনা করা হয়েছে। \
ডিফল্টভাবে, কন্টেইনারগুলি যে ক্রমে তৈরি করা হয়েছিল সেই ক্রমে প্রদর্শিত হবে, সর্বশেষটি উপরে থাকবে। \
কন্টেইনারগুলির তালিকাকে অন্য ক্রমে সাজাতে, তালিকা বারের উপরে <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;সাজান</span> আইকনে ক্লিক করুন। \
স্ক্রিনের নীচে দেখানো হবে যে কতগুলি কন্টেইনার বিদ্যমান। \
উদাহরণস্বরূপ যদি 20টি কন্টেইনার থাকে এবং বর্তমান স্ক্রিনে 14টি তালিকাভুক্ত থাকে, তাহলে স্ক্রিনের নীচে আপনি দেখতে পাবেন \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> 1-14 এর 20 <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
তালিকায় একটি করে এগিয়ে যেতে, <img src="/images/simplePagerNextPage.png">-এ ক্লিক করুন। \
একটি সম্পূর্ণ পৃষ্ঠা এগিয়ে যেতে, <img src="/images/simplePagerLastPage.png">-এ ক্লিক করুন। \
একইভাবে, তালিকায় একটি করে পিছিয়ে যেতে, <img src="/images/simplePagerPreviousPage.png">-এ ক্লিক করুন \
এবং একটি সম্পূর্ণ পৃষ্ঠা পিছিয়ে যেতে, <img src="/images/simplePagerFirstPage.png">-এ ক্লিক করুন। \
একটি কন্টেইনারের আইটেমগুলি দেখতে, এর নামে ক্লিক করুন। </p>\
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">নতুন কন্টেইনার তৈরি করুন</font></b></span></p> \
<p><b><font color="blue">নতুন কন্টেইনার তৈরি করুন</font></b> মেনু একটি কন্টেইনার তৈরি করতে ব্যবহৃত হয়। কন্টেইনারটিকে একটি নাম দেওয়া যেতে পারে। \
এই নামটি ব্যবহারকারীর মালিকানাধীন সমস্ত কন্টেইনারের সংগ্রহ থেকে একটি নির্দিষ্ট কন্টেইনার খুঁজে পেতে অনুসন্ধানে ব্যবহার করা যেতে পারে। </p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">আমার কন্টেইনারসমূহ</font></b></span></p> \
<p><b><font color="blue">আমার কন্টেইনারসমূহ</font></b> মেনু ব্যবহারকারীর মালিকানাধীন সমস্ত কন্টেইনারের একটি তালিকা পেতে ব্যবহৃত হয়। \
যে ব্যবহারকারী/গ্রুপগুলির সাথে কন্টেইনারটি শেয়ার করা হয়েছে তাদের তালিকা দেখতে, <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">তালিকা</span>-তে ক্লিক করুন। </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">অন্যদের সাথে শেয়ার করা আমার কন্টেইনারসমূহ</font></b></span></p> \
<p><b><font color="blue">অন্যদের সাথে শেয়ার করা আমার কন্টেইনারসমূহ</font></b> মেনু অন্য ব্যবহারকারী/গ্রুপগুলির সাথে শেয়ার করা সমস্ত কন্টেইনারের তালিকা দেয়। \
তালিকার মধ্যে নেভিগেট করা "আমার কন্টেইনারসমূহ" মেনুর অধীনে উল্লিখিত নেভিগেশন বিবরণের অনুরূপ। </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">আমার সাথে শেয়ার করা কন্টেইনারসমূহ</font></b></span></p> \
<p><b><font color="blue">আমার সাথে শেয়ার করা কন্টেইনারসমূহ</font></b> মেনু অন্যরা ব্যবহারকারীর সাথে শেয়ার করেছে এমন সমস্ত আইটেমের তালিকা দেয়।</p> \
</span>
templatesMenuHelpTitle=টেমপ্লেট
templatesMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">টেমপ্লেট</font></b></div></p> \
<p>একটি টেমপ্লেট একটি আইটেমের লেআউট বর্ণনা করে। প্রতিটি টেমপ্লেট একাধিক &lt;ক্ষেত্র,মান&gt; জোড়া দিয়ে গঠিত। যেকোনো সংখ্যক ক্ষেত্র থাকতে পারে এবং সেগুলি আইটেম তৈরি করার জন্য একটি গাইড হিসাবে ব্যবহৃত হয়। \
উদাহরণস্বরূপ, "ইমেইল অ্যাকাউন্ট" নামে একটি টেমপ্লেটে "url", "ব্যবহারকারীর নাম" এবং "পাসওয়ার্ড" ক্ষেত্র থাকতে পারে। \
<p> যখন একটি আইটেম তৈরি করতে একটি টেমপ্লেট ব্যবহার করা হয়, পূর্বনির্ধারিত ক্ষেত্রগুলি উপস্থাপন করা হবে এবং ব্যবহারকারীকে \
শুধুমাত্র সেই ক্ষেত্রগুলির জন্য মান প্রদান করতে হবে। \
উদাহরণস্বরূপ, \
যখন "ব্যক্তিগত ইমেইল" নামে একটি আইটেম তৈরি করতে "ইমেইল অ্যাকাউন্ট" টেমপ্লেট ব্যবহার করা হয়, \
url, ব্যবহারকারীর নাম এবং পাসওয়ার্ড ক্ষেত্রগুলির জন্য মান ব্যবহারকারী দ্বারা সরবরাহ করতে হবে। \
<p>টেমপ্লেট গ্লোবাল বা ব্যক্তিগত হতে পারে। একটি ব্যক্তিগত টেমপ্লেটের ক্ষেত্রগুলি ব্যবহারকারী দ্বারা সংজ্ঞায়িত করতে হবে। \
কাস্টমাইজেশনের জন্য একটি গ্লোবাল টেমপ্লেটকে একটি ব্যক্তিগত টেমপ্লেটে কপি করাও সম্ভব। \
ব্যবহারকারীরা তাদের ব্যক্তিগত টেমপ্লেট তৈরি/পরিবর্তন/মুছে ফেলতে পারেন। \
ওবিডোস পূর্বনির্ধারিত গ্লোবাল টেমপ্লেটের একটি সংখ্যা নিয়ে আসে। \
শুধুমাত্র অনুমতিপ্রাপ্ত ব্যবহারকারীরা গ্লোবাল টেমপ্লেট তৈরি/পরিবর্তন/মুছে ফেলতে পারেন।</p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">নতুন ব্যক্তিগত টেমপ্লেট তৈরি করুন</font></b></span></p> \
<p><b><font color="blue">নতুন ব্যক্তিগত টেমপ্লেট তৈরি করুন</font></b> মেনু একটি নতুন ব্যক্তিগত টেমপ্লেট তৈরি করতে ব্যবহৃত হয়। টেমপ্লেটটিকে একটি নাম দেওয়া যেতে পারে। \
এই নামটি ব্যবহারকারীর মালিকানাধীন সমস্ত ব্যক্তিগত টেমপ্লেটের সংগ্রহ থেকে একটি নির্দিষ্ট টেমপ্লেট খুঁজে পেতে অনুসন্ধানে ব্যবহার করা যেতে পারে। </p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">ব্যক্তিগত টেমপ্লেট</font></b></span></p> \
<p><b><font color="blue">ব্যক্তিগত টেমপ্লেট</font></b> মেনু ব্যবহারকারীর মালিকানাধীন সমস্ত ব্যক্তিগত টেমপ্লেটের একটি তালিকা পেতে ব্যবহৃত হয়। \
টেমপ্লেটগুলি যে ক্রমে তৈরি করা হয়েছিল সেই ক্রমে প্রদর্শিত হবে, সর্বশেষটি উপরে থাকবে। \
স্ক্রিনের নীচে দেখানো হবে যে কতগুলি টেমপ্লেট বিদ্যমান। \
উদাহরণস্বরূপ যদি 17টি ব্যক্তিগত টেমপ্লেট থাকে এবং স্ক্রিনে 14টি তালিকাভুক্ত হয়, আপনি দেখবেন \
