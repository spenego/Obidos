listContainersHelp=<ul style="padding-left:2px"> \
<li>একটি কন্টেইনারে থাকা আইটেমের তালিকা দেখতে, কন্টেইনারের নামে ক্লিক করুন। একটি কন্টেইনারের নাম পরিবর্তন করতে, <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> সম্পাদনা</span> ব্যবহার করুন। একটি কন্টেইনার অন্যদের সাথে <i class="fa fa-share-alt-square" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">শেয়ার</span> ক্রিয়া ব্যবহার করে শেয়ার করা যেতে পারে।</li>\
<li> যদি একটি কন্টেইনার শেয়ার করা হয়ে থাকে, তাহলে কন্টেইনারের নামের আগে <i class="fa fa-share-square" style="color:#1E8CFF;"></i> আইকনটি প্রদর্শিত হবে। \
ইতিমধ্যে শেয়ার করা একটি কন্টেইনার <i class="fa fa-ban" style="color:#F65D3C"></i><span style="color: #F65D3C;"> প্রত্যাহার</span> অপশন ব্যবহার করে প্রত্যাহার করা যেতে পারে।</li>\
<li>কন্টেইনারটি যাদের সাথে শেয়ার করা হয়েছে সেই ব্যবহারকারী/গ্রুপের তালিকা দেখতে, <span style="font-weight: bold">শেয়ার করা হয়েছে</span> কলামের অধীনে <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">তালিকা</span>-তে ক্লিক করুন।</li>\
<li>কন্টেইনার(গুলি) মুছতে, প্রথমে চেকবক্সে ক্লিক করে কন্টেইনার(গুলি) নির্বাচন করুন। \
তারপর তালিকার উপরে <i class="fa fa-times-circle" style="color:red"></i><span style="border-radius:3px;">&nbsp;<b style="color:#ff0000;">মুছুন</b> </span> \
বোতামে ক্লিক করুন। আপনাকে মুছে ফেলার নিশ্চিতকরণের জন্য জিজ্ঞাসা করা হবে। \
যখন একটি কন্টেইনার মুছে ফেলা হয়, তখন অন্যদের সাথে শেয়ার করা কপিগুলি সহ কন্টেইনারের সমস্ত কপি (এবং এর ভিতরের আইটেমগুলি) মুছে ফেলা হবে।</li> \
</ul>
createContainerHelp=<ul style="padding-left:2px"><li>কন্টেইনার আইটেম ধারণ করে। আদর্শভাবে, একটি কন্টেইনারের নাম এটি যে ধরনের আইটেম ধারণ করবে তা চিহ্নিত করা উচিত। উদাহরণস্বরূপ ব্যাংক, ক্রেডিট কার্ড, সিস্টেম ইত্যাদি। কন্টেইনারের নাম পরে পরিবর্তন করা যেতে পারে।</li>\
<li>কন্টেইনার শেয়ারযোগ্য বা ব্যক্তিগত ধরনের হতে পারে। শুধুমাত্র শেয়ারযোগ্য কন্টেইনারগুলি অন্য ব্যবহারকারী/গোষ্ঠীর সাথে শেয়ার করা যেতে পারে।</li>\
<li><span style="font-weight: bold;color:#FF0000;">একটি কন্টেইনারের ধরন কখনই পরিবর্তন করা যায় না</span>। তাই একটি ব্যক্তিগত কন্টেইনার সবসময় ব্যক্তিগত থাকবে এবং একটি শেয়ারযোগ্য কন্টেইনার সবসময় শেয়ারযোগ্য থাকবে।</li> \
<li>শেয়ারযোগ্য কন্টেইনারের ভিতরের আইটেমগুলি শেয়ারযোগ্য বা ব্যক্তিগত হতে পারে। তবে, একটি ব্যক্তিগত কন্টেইনারের ভিতরের আইটেমগুলি \
সবসময় ব্যক্তিগত।</li> \
<li>যদি একটি শেয়ারযোগ্য কন্টেইনার শেয়ার করা হয়, তবে শুধুমাত্র কন্টেইনারের ভিতরের শেয়ারযোগ্য আইটেমগুলি শেয়ার করা হবে।</li></ul>

adminMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">প্রশাসকগণ</font></b></div></p> \
<p><b>নতুন প্রশাসক তৈরি করুন:</b> রুট প্রশাসক এবং প্রশাসক তৈরির অধিকার সহ প্রশাসকরা নতুন প্রশাসক তৈরি করতে পারেন। প্রশাসকের এটি করার ক্ষমতা না থাকলে এই মেনু আইটেমটি নিষ্ক্রিয় থাকবে।</p> \
<p><b>প্রশাসক পরিচালনা করুন:</b> প্রশাসক প্রোফাইলের তালিকা দেখায়, যেখানে তথ্য সম্পাদনা করা যায় এবং প্রশাসকদের লক বা টম্বস্টোন করা যায়। প্রশাসকের এটি করার ক্ষমতা না থাকলে এই মেনু আইটেমটি নিষ্ক্রিয় থাকবে।</p> \
<p><b>লক করা প্রশাসকগণ:</b> লক করা প্রশাসকদের তালিকা দেখায়, এবং তাদের আনলক করার বিকল্প দেয়। প্রশাসকের এটি করার ক্ষমতা না থাকলে এই মেনু আইটেমটি নিষ্ক্রিয় থাকবে।</p> \
<p><b>টম্বস্টোন করা প্রশাসকগণ:</b> টম্বস্টোন করা প্রশাসকদের তালিকা দেখায়, এবং তাদের পুনরুদ্ধার করার বিকল্প দেয়। প্রশাসকের এটি করার ক্ষমতা না থাকলে এই মেনু আইটেমটি নিষ্ক্রিয় থাকবে।</p>\
</span>

usersMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">ব্যবহারকারীগণ</font></b></div></p> \
<p><b>নতুন ব্যবহারকারী তৈরি করুন</b> মেনুটি রুট প্রশাসক বা ব্যবহারকারী অ্যাকাউন্ট তৈরির ক্ষমতা সহ প্রশাসকদের দ্বারা নতুন ব্যবহারকারী অ্যাকাউন্ট তৈরি করার জন্য।</p> \
<p><b>ব্যবহারকারী পরিচালনা করুন</b> মেনুটি সক্রিয় ব্যবহারকারী অ্যাকাউন্টের তালিকা প্রদান করতে ব্যবহৃত হয়। এই তালিকা থেকে একটি ব্যবহারকারী অ্যাকাউন্টের প্রোফাইল বা প্রমাণীকরণ সম্পাদনা করা যেতে পারে।</p>\
<p><b>লক করা ব্যবহারকারীগণ</b> মেনুটি লক করা ব্যবহারকারী অ্যাকাউন্টের তালিকা প্রদান করতে ব্যবহৃত হয়। \
এই তালিকা ব্যবহার করে, একটি লক করা ব্যবহারকারী অ্যাকাউন্ট আনলক করা যেতে পারে। </p>\
<p><b>টম্বস্টোন করা ব্যবহারকারীগণ</b> মেনুটি টম্বস্টোন করা ব্যবহারকারী অ্যাকাউন্টের তালিকা প্রদান করে, যেগুলি মুছে ফেলা হিসাবে চিহ্নিত করা হয়েছে। এই অ্যাকাউন্টগুলি পুনরুদ্ধার করা যেতে পারে কিন্তু এই মুহূর্তে স্থায়ীভাবে মুছে ফেলা যাবে না।</p>\
</span>

settingsMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">সেটিংস</font></b></div></p> \
<p><b>AD/LDAP তৈরি করুন</b> মেনুটি ব্যবহারকারী প্রমাণপত্রের উৎস হিসাবে কোনও এন্টারপ্রাইজ অ্যাক্টিভ ডিরেক্টরি বা LDAP-এর নির্দিষ্ট বিষয়গুলি কনফিগার করতে ব্যবহৃত হয়। </p>\
<p><b>SMTP সেটিংস তৈরি করুন</b> অবিদোসকে ইমেল বিজ্ঞপ্তি পাঠাতে সক্ষম করার জন্য কর্পোরেট ইমেল গেটওয়ে কনফিগার করতে দেয়। </p>\
<p><b>সিস্টেম সেটিংস</b> মেনুটি http/s সেটিংস, 2FA ইস্যুকারী, তারিখের ফরম্যাট, স্থানীয় পাসওয়ার্ড নীতি এবং পাসফ্রেজ নীতি সেট করতে ব্যবহার করা যেতে পারে। </p>\
<p>অবিদোসের ওয়েব ফ্রন্ট-এন্ডের জন্য একটি SSL সার্টিফিকেট প্রয়োজন। এটি <b>ওয়েব SSL সার্টিফিকেট ইনস্টল করুন</b> মেনু ব্যবহার করে ইনস্টল করা যেতে পারে </p>\
<p>যদি অ্যাক্টিভ ডিরেক্টরি বা LDAP নিরাপদ সংযোগ ব্যবহার করার জন্য কনফিগার করা হয়, তাহলে এই নিরাপদ যোগাযোগের জন্য ব্যবহৃত সার্টিফিকেট \
অবিদোস পক্ষে ইনস্টল করতে হবে। <b>AD/LDAP সার্ভার সার্টিফিকেট ইনস্টল করুন</b> মেনুটি এটি সহজ করে।</p>\
<p>অবিদোসের জন্য সফটওয়্যার লাইসেন্স <b>অবিদোস লাইসেন্স ইনস্টল করুন</b> মেনু ব্যবহার করে ইনস্টল করা যেতে পারে। বর্তমান লাইসেন্স মেয়াদ শেষ হওয়ার আগে \
আপগ্রেড লাইসেন্স ইনস্টল করে অবিচ্ছিন্ন সেবা বজায় রাখা যেতে পারে। </p>\
</span>

auditMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">নিরীক্ষণ</font></b></div></p> \
<p>নিরীক্ষণ প্রতিবেদনটি সাধারণভাবে সিস্টেমের একটি স্থির প্রতিবেদন দেখায়।</p> \
<p>নিরীক্ষণ লগগুলি নির্দিষ্ট ব্যবহারকারীদের কার্যকলাপ বা নির্দিষ্ট ঘটনার ঘটনা দেখতে দেয়। \
অনুসন্ধান সীমিত করতে, আগ্রহের কার্যকলাপ নির্দিষ্ট করা যেতে পারে। অন্যথায় সব কার্যকলাপ ডিফল্টভাবে প্রদর্শিত হবে। \
আগ্রহের সময়কাল ক্যালেন্ডার থেকে বেছে নেওয়া যেতে পারে। </p>\
</span>
