itemsMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">আইটেম</font></b></div></p> \
<p>একটি আইটেম হল একটি টেমপ্লেটের উদাহরণ বা একটি অ্যাড হক &lt;ক্ষেত্র,মান&gt; জোড়া সেট বা একটি নোট। প্রতিটি আইটেম একটি কন্টেইনারের ভিতরে রাখা হয়।</p>\
<p>প্রতিটি স্ক্রিনে স্ক্রিন-নির্দিষ্ট সাহায্য রয়েছে যা প্যানেলের উপরের ডান দিকে <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-info-circle" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;সাহায্য&nbsp</span></span> আইকনে ক্লিক করে অ্যাক্সেস করা যায়। \
একবার আপনি একটি নিম্ন স্তরের স্ক্রিনে নেভিগেট করলে, পূর্ববর্তী স্ক্রিনে ফিরে যেতে, প্যানেলের উপরের বাম দিকে <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-arrow-circle-left" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;পিছনে&nbsp</span></span> বোতাম ব্যবহার করুন। </p>\
<p>তালিকা মেনুগুলির মাধ্যমে নেভিগেশন একই রকম এবং এখানে বর্ণনা করা হয়েছে। \
ডিফল্টভাবে, আইটেমগুলি যে ক্রমে তৈরি করা হয়েছিল সেই ক্রমে প্রদর্শিত হবে, সর্বশেষটি উপরে থাকবে। \
আইটেমের তালিকাটি অন্য ক্রমে সাজাতে, তালিকা বারের উপরে <i class="fa fa-sort" style="color:blue;"></i><span style="color: blue;">বাছাই</span> আইকনে ক্লিক করুন। \
স্ক্রিনের নীচে দেখানো হবে যে কতগুলি আইটেম বিদ্যমান। \
উদাহরণস্বরূপ যদি ৪৩টি আইটেম থাকে এবং বর্তমান স্ক্রিনে ১২টি তালিকাভুক্ত থাকে, তাহলে স্ক্রিনের নীচে আপনি দেখতে পাবেন \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> ১-১২ এর ৪৩ <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
তালিকায় একটি করে এগিয়ে যেতে, <img src="/images/simplePagerNextPage.png"> এ ক্লিক করুন। \
একটি সম্পূর্ণ পৃষ্ঠা এগিয়ে যেতে, <img src="/images/simplePagerLastPage.png"> এ ক্লিক করুন। \
একইভাবে, তালিকায় একটি করে পিছিয়ে যেতে, <img src="/images/simplePagerPreviousPage.png"> এ ক্লিক করুন \
এবং একটি সম্পূর্ণ পৃষ্ঠা পিছিয়ে যেতে, <img src="/images/simplePagerFirstPage.png"> এ ক্লিক করুন। \
আইটেমটি দেখতে, এর নামে ক্লিক করুন। </p>\
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">নতুন আইটেম তৈরি করুন</font></b></span></p> \
<p><b><font color="blue">নতুন আইটেম তৈরি করুন</font></b> মেনুটি একটি আইটেম তৈরি করতে ব্যবহৃত হয়। আইটেমটিকে একটি নাম দেওয়া যেতে পারে। \
এই নামটি ব্যবহারকারীর মালিকানাধীন সমস্ত আইটেমের সংগ্রহ থেকে একটি নির্দিষ্ট আইটেম খুঁজে পেতে অনুসন্ধানে ব্যবহার করা যেতে পারে। </p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">আমার আইটেম</font></b></span></p> \
<p><b><font color="blue"> আমার আইটেম</font></b> মেনুটি ব্যবহারকারীর মালিকানাধীন সমস্ত কন্টেইনার থেকে সমস্ত আইটেমের একটি তালিকা পেতে ব্যবহৃত হয়। \
যদি একটি আইটেম অন্য ব্যবহারকারী/গ্রুপের সাথে শেয়ার করা হয়েছিল, তাহলে আইটেমের নামের আগে <i class="fa fa-share-square" style="color:green"></i> আইকনটি প্রদর্শিত হবে। \
যে ব্যবহারকারী/গ্রুপের সাথে আইটেমটি শেয়ার করা হয়েছিল তাদের তালিকা দেখতে, <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">তালিকা</span> এ ক্লিক করুন। </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">অন্যদের সাথে শেয়ার করা আমার আইটেম</font></b></span></p> \
<p><b><font color="blue">অন্যদের সাথে শেয়ার করা আমার আইটেম</font></b> মেনুতে অন্য ব্যবহারকারী/গ্রুপের সাথে শেয়ার করা সমস্ত আইটেম তালিকাভুক্ত করে। প্রতিটি আইটেমের অপারেশনগুলি "আমার আইটেম" মেনুর অধীনে অপারেশনগুলির সাথে হুবহু একই। </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">আমার সাথে শেয়ার করা আইটেম</font></b></span></p> \
<p><b><font color="blue">আমার সাথে শেয়ার করা আইটেম</font></b> মেনুতে অন্যরা ব্যবহারকারীর সাথে যে সমস্ত আইটেম শেয়ার করেছে সেগুলি তালিকাভুক্ত করে।</p> \
</span>

