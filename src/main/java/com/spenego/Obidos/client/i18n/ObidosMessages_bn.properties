<li>আপনার প্রাথমিক ইমেইল ঠিকানায় একটি ইমেইল পাঠানো হবে। অনুগ্রহ করে \
আপনার পাসফ্রেজ রিসেট করার জন্য নির্দেশাবলী অনুসরণ করুন।</li> \
</ul>

