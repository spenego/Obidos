<li>একটি গ্রুপের নাম বা মন্তব্য পরিবর্তন করতে <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> সম্পাদনা করুন</span>-এ ক্লিক করুন। একটি গ্রুপ মুছতে, এটি নির্বাচন করুন এবং <i class="fa fa-times-circle" style="color:red"></i><span style="border-radius:3px;color:#ff0000;font-weight:bold;">&nbsp;মুছুন</span>-এ ক্লিক করুন। \
