<li>টেমপ্লেটগুলিতে ফিল্ডগুলি সংজ্ঞায়িত থাকে। উদাহরণস্বরূপ, একটি ক্রেডিট কার্ড টেমপ্লেটে <b>ক্রেডিট কার্ড নম্বর</b>, <b>ক্রেডিট কার্ডে নাম</b>, <b>মেয়াদ শেষের তারিখ</b> ইত্যাদি থাকতে পারে।</li> \
<li>টেমপ্লেটের নাম, ফিল্ড এবং প্রদর্শনের ক্রম যেকোনো সময় পরিবর্তন করা যায়। এই পরিবর্তনগুলি শুধুমাত্র নতুন আইটেমগুলিকে প্রভাবিত করবে। টেমপ্লেটের নাম অনুসন্ধানে ব্যবহার করা যেতে পারে।</li> \
<li>ব্যক্তিগত টেমপ্লেটগুলি শুধুমাত্র মালিক দ্বারা ব্যবহার করা যেতে পারে এবং অন্য ব্যবহারকারীদের কাছে দৃশ্যমান নয়।</li> \
<li>একটি নতুন ফিল্ড নাম এবং প্রদর্শন ক্রমের সারি খুলতে, <b>ফিল্ড নাম</b> টেক্সটবক্সে থাকাকালীন <b>ENTER চাপুন</b> অথবা <i class="fa fa-plus-square" style="color:#17a2b8"></i> বোতামে ক্লিক করুন</li> \
</ul>

createGlobalTemplateHelp= <ul style="padding-left:2px"><li>একটি টেমপ্লেট আইটেমগুলির সাধারণ কাঠামো ধারণ করে। \
উদাহরণস্বরূপ, <b>ক্রেডিট কার্ড</b>, <b>ওয়েবসাইট লগইন তথ্য</b> ইত্যাদি।</li>  \
<li>টেমপ্লেটগুলিতে শুধুমাত্র ফিল্ডগুলি সংজ্ঞায়িত থাকে। উদাহরণস্বরূপ, একটি ক্রেডিট কার্ড টেমপ্লেটে <b>ক্রেডিট কার্ড নম্বর</b>, <b>ক্রেডিট কার্ডে নাম</b>, <b>মেয়াদ শেষের তারিখ</b> ইত্যাদি ফিল্ড থাকতে পারে।</li> \
<li>টেমপ্লেটের নাম, ফিল্ড এবং প্রদর্শনের ক্রম যেকোনো সময় পরিবর্তন করা যায়। শুধুমাত্র টেমপ্লেটের নাম এনক্রিপ্ট করা হয় না এবং অনুসন্ধানে ব্যবহার করা যেতে পারে।</li> \
<li>গ্লোবাল টেমপ্লেটগুলি সকল ব্যবহারকারীর জন্য উপলব্ধ। ব্যবহারকারীরা একটি গ্লোবাল টেমপ্লেটকে একটি লোকাল টেমপ্লেটে কপি করে তাদের প্রয়োজন অনুযায়ী পরিবর্তন করতে পারেন।</li> \
<li>একটি নতুন ফিল্ড নাম এবং প্রদর্শন ক্রমের সারি খুলতে, <b>ফিল্ড নাম</b> টেক্সটবক্সে থাকাকালীন <b>ENTER চাপুন</b> অথবা <i class="fa fa-plus-square" style="color:#17a2b8"></i> বোতামে ক্লিক করুন</li> \
</ul>


