<li> বর্তমানে আমরা টুইলিও <a href="https://www.twilio.com/">www.twilio.com</a> এপিআই ব্যবহার করে এসএমএস পাঠাই</li> \
<li>অনুগ্রহ করে টুইলিও <a href="https://www.twilio.com/">www.twilio.com</a> এসএমএস প্রদানকারীর সাথে নিবন্ধন করুন \
<b>অ্যাকাউন্ট সিকিউরিটি \
আইডেন্টিফায়ার (এসআইডি)</b>, <b>অথ টোকেন</b> এবং <b>ফোন নম্বর</b> পেতে। দ্রষ্টব্য: যুক্তরাষ্ট্রে এসএমএস পাঠানোর ক্ষেত্রে, \
এসএমএস প্রদানকারী দ্বারা প্রদত্ত ফোন নম্বরটি অবশ্যই এসএমএস প্রদানকারীর সাথে A2P 10DLC কমপ্লায়েন্সের জন্য নিবন্ধিত হতে হবে, \
অন্যথায় মার্কিন ক্যারিয়ারগুলি এসএমএস প্রত্যাখ্যান করবে। \
এসএমএস বার্তাটি টুইলিও প্রদত্ত ফোন নম্বর থেকে উৎপন্ন হবে। এই তথ্যগুলি নিরাপদে \
ওবিদোস ডাটাবেসে সংরক্ষিত থাকে</li> \
<li>যদি আপনি চান যে ব্যবহারকারীরা কোনো আইটেম, নোট বা কন্টেইনার তাদের সাথে শেয়ার করা হলে এসএমএস বিজ্ঞপ্তি পাবে, \
তাহলে টুইলিও এসএমএস কনফিগার করুন</li> \
<li>ব্যবহারকারীরা তাদের প্রোফাইল পৃষ্ঠা থেকে এসএমএস বিজ্ঞপ্তি বার্তা গ্রহণ করতে চান কিনা তা কনফিগার করতে পারবেন</li> \
<li>এসএমএস ব্যবহারকারীর <b>কনফিগার করা মোবাইল ফোন নম্বরে</b> পাঠানো হবে। \
ফোন নম্বরটি অবশ্যই এসএমএস গ্রহণ করতে সক্ষম হতে হবে</li> \
</ul>
