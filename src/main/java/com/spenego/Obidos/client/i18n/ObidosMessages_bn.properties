listGroupsHelp=<ul style="padding-left:2px"><li>একটি গ্রুপে ব্যবহারকারী যোগ করতে, <i class="fa fa-plus-circle" style="color:green"></i><span style="color: #1E8CFF;"> যোগ করুন</span>-এ ক্লিক করুন। গ্রুপের ব্যবহারকারীদের তালিকা দেখতে, <span style="font-weight:bold;">গ্রুপের নাম</span> কলামের অধীনে এর নামে ক্লিক করুন।</li> \
