whatIsAContainerHelp = একটি কন্টেইনারে <b>আইটেম</b> থাকে। আইটেম হতে পারে একটি ওয়েবসাইট, কম্পিউটার বা আপনার ক্রেডিট কার্ড সম্পর্কে লগইন তথ্য বা শুধু সাধারণ নোট। \
কন্টেইনার হতে পারে <b>শেয়ারযোগ্য</b> বা <b>ব্যক্তিগত</b>। একটি শেয়ারযোগ্য কন্টেইনার ব্যবহারকারী বা গ্রুপের সাথে শেয়ার করা যেতে পারে। \
কন্টেইনারের ভিতরের আইটেমগুলিও শেয়ারযোগ্য বা ব্যক্তিগত হতে পারে। একটি শেয়ারযোগ্য আইটেম ব্যবহারকারী বা গ্রুপের সাথে শেয়ার করা যেতে পারে। \
<b>নোট</b>: একটি কন্টেইনারের পদবি কখনও পরিবর্তন করা যাবে না। একটি ব্যক্তিগত কন্টেইনার সবসময় ব্যক্তিগত থাকবে এবং একইভাবে।
