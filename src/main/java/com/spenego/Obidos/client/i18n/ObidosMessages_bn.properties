notesMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">নোট</font></b></div></p> \
<p>একটি নোট হল পোস্টিট নোটের অনুরূপ। একটি নোটের একটি নাম এবং বিষয়বস্তু রয়েছে। নোটগুলি স্বতন্ত্র হতে পারে বা কন্টেইনারের মধ্যে রাখা যেতে পারে। এই বিভাগে, আমরা স্বতন্ত্র নোটগুলির জন্য উপলব্ধ মেনুগুলি ব্যাখ্যা করব।</p> \
<p>প্রতিটি স্ক্রিনে স্ক্রিন-নির্দিষ্ট সাহায্য রয়েছে যা প্যানেলের উপরের ডানদিকে <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-info-circle" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;সাহায্য&nbsp</span></span> বোতামে ক্লিক করে অ্যাক্সেস করা যায়। \
একবার আপনি একটি নিম্ন স্তরের স্ক্রিনে নেভিগেট করলে, পূর্ববর্তী স্ক্রিনে ফিরে যেতে, প্যানেলের উপরের বাম দিকে <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-arrow-circle-left" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;পিছনে&nbsp</span></span> বোতাম ব্যবহার করুন। </p>\
<p>তালিকা মেনুগুলির মধ্যে নেভিগেশন একই রকম এবং এখানে বর্ণনা করা হয়েছে। \
ডিফল্টভাবে, নোটগুলি সেই ক্রমে প্রদর্শিত হবে যেভাবে তারা তৈরি করা হয়েছিল, সর্বশেষটি শীর্ষে থাকবে। \
নোটের তালিকাটি অন্য ক্রমে সাজাতে, তালিকা বারের উপরে <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;সাজান</span> আইকনে ক্লিক করুন। \
স্ক্রিনের নীচে দেখানো হবে কতগুলি নোট বিদ্যমান। \
উদাহরণস্বরূপ যদি 23টি নোট থাকে এবং বর্তমান স্ক্রিনে 14টি তালিকাভুক্ত থাকে, তাহলে স্ক্রিনের নীচে আপনি দেখতে পাবেন \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> 23 এর মধ্যে 1-14 <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
তালিকায় একবারে একটি করে এগিয়ে যেতে, <img src="/images/simplePagerNextPage.png"> এ ক্লিক করুন। \
সম্পূর্ণ একটি পৃষ্ঠা এগিয়ে যেতে, <img src="/images/simplePagerLastPage.png"> এ ক্লিক করুন। \
একইভাবে, তালিকায় একবারে একটি করে পিছনে যেতে, <img src="/images/simplePagerPreviousPage.png"> এ ক্লিক করুন \
এবং সম্পূর্ণ একটি পৃষ্ঠা পিছনে যেতে, <img src="/images/simplePagerFirstPage.png"> এ ক্লিক করুন। \
একটি নোটের বিষয়বস্তু দেখতে, এর নামে ক্লিক করুন। </p>\
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">নতুন নোট তৈরি করুন</font></b></span></p> \
<p><b><font color="blue">নতুন নোট তৈরি করুন</font></b> মেনু একটি নোট তৈরি করতে ব্যবহৃত হয়। নোটটির একটি নাম দেওয়া যেতে পারে। এই নামটি ব্যবহারকারীর মালিকানাধীন সমস্ত নোটের সংগ্রহ থেকে একটি নির্দিষ্ট নোট খুঁজে পেতে অনুসন্ধানে ব্যবহার করা যেতে পারে। একটি নোটের বিষয়বস্তু হল নোটের সাথে সম্পর্কিত পাঠ্য। বিষয়বস্তুটি এনক্রিপ্ট করে সংরক্ষণ করা হয়।</p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">আমার নোট</font></b></span></p> \
<p><b><font color="blue">আমার নোট</font></b> মেনু ব্যবহারকারীর মালিকানাধীন সমস্ত স্বতন্ত্র নোটের তালিকা প্রদর্শন করে। \
যদি কোনও নোট অন্য ব্যবহারকারী/গ্রুপের সাথে শেয়ার করা হয়ে থাকে, তাহলে নোটের নামের আগে <i class="fa fa-share-square" style="color:#1E8CFF;"></i> আইকনটি প্রদর্শিত হবে। \
যে ব্যবহারকারী/গ্রুপের সাথে নোটটি শেয়ার করা হয়েছে তাদের তালিকা দেখতে, <i class="fa fa-users" style="color:#1E8CFF;"></i> <span style="color: #1E8CFF;">তালিকা</span> এ ক্লিক করুন। </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">অন্যদের সাথে শেয়ার করা আমার নোট</font></b></span></p> \
<p><b><font color="blue">অন্যদের সাথে শেয়ার করা আমার নোট</font></b> মেনু অন্য ব্যবহারকারী/গ্রুপের সাথে শেয়ার করা সমস্ত নোটের তালিকা দেখায়। প্রতিটি নোটের উপর অপারেশনগুলি "আমার নোট" মেনুর অধীনে অপারেশনগুলির সাথে হুবহু একই। </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">আমার সাথে শেয়ার করা নোট</font></b></span></p> \
<p><b><font color="blue">আমার সাথে শেয়ার করা নোট</font></b> মেনু অন্যরা আপনার সাথে শেয়ার করেছে এমন সমস্ত নোটের তালিকা দেখায়। \
<span style="font-weight: bold">শেয়ার করেছেন</span> কলামে দেখানো হয় কে আপনার সাথে নোটটি শেয়ার করেছেন। \
যদি একটি নোটের মালিক আপনাকে নোটটি সম্পাদনা করার অনুমতি দিয়ে থাকেন, তাহলে আপনি <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> সম্পাদনা করুন</span> ব্যবহার করে নোটের বিষয়বস্তু পরিবর্তন করতে পারেন। </p>\
</span>

historyMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">ইতিহাস</font></b></div></p> \
<p>একটি নির্দিষ্ট সময়কালে কার্যকলাপের ইতিহাস নির্বাচিতভাবে প্রদর্শন করা যেতে পারে।</p> \
<p>আগ্রহের কার্যকলাপ নির্দিষ্ট করা যেতে পারে। অন্যথায় ডিফল্টভাবে সমস্ত কার্যকলাপ প্রদর্শিত হবে। \
আগ্রহের সময়কাল ক্যালেন্ডার থেকে বেছে নেওয়া যেতে পারে। </p>\
</span>

createNoteHelp=<ul style="padding-left: 2px"><li><b>নোটের নাম</b> এনক্রিপ্ট করা হয় না এবং অনুসন্ধানে ব্যবহার করা যেতে পারে। লাল খোলা তালা আইকন <i class="fa fa-unlock" style="color:red"></i> নির্দেশ করে যে \
নোটের নাম এনক্রিপ্ট না করে সংরক্ষণ করা হয়।</li>\
<li>নোটের বিষয়বস্তু সবুজ <i class="fa fa-lock" style="color:green"></i> আইকন দ্বারা নির্দেশিত হিসাবে এনক্রিপ্ট করে রাখা হয়। তাই এটি অনুসন্ধান করা যাবে না। নোটের বিষয়বস্তুতে যেকোনো XSS সংরক্ষণের আগে পরিষ্কার করা হবে।</li> \
<li>শুধুমাত্র একটি শেয়ারযোগ্য নোট অন্য ব্যবহারকারী/গ্রুপের সাথে শেয়ার করা যেতে পারে। ব্যক্তিগত নোট সর্বদা ব্যক্তিগত থাকবে।</li>\
<li>একটি শেয়ারযোগ্য নোটের জন্য, একটি মেয়াদ শেষ হওয়ার তারিখ সেট করা যেতে পারে। যখন নোটটি কারও সাথে শেয়ার করা হয়, সেই তারিখে নোটটির মেয়াদ শেষ হয়ে যাবে। মেয়াদ শেষ হওয়ার তারিখ যেকোনো সময় পরিবর্তন করা যেতে পারে।</li>\
</ul>
listNotesHelp=<ul style="padding-left:2px">\
<li>নোটের বিষয়বস্তু দেখতে, এর নামে ক্লিক করুন। নোটের তালিকা সাজাতে, <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;সাজান</span>-এ ক্লিক করুন। \
নোটের নাম/বিষয়বস্তু পরিবর্তন করতে <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> সম্পাদনা</span> ব্যবহার করুন।</li> \
<li>অন্যদের সাথে একটি নোট শেয়ার করতে, <i class="fa fa-share-alt-square" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">শেয়ার</span>-এ ক্লিক করুন। \
একবার নোট শেয়ার করা হলে, এর নামের আগে <i class="fa fa-share-square" style="color:#1E8CFF;"></i> আইকনটি প্রদর্শিত হবে। \
একটি শেয়ার করা নোট <i class="fa fa-ban" style="color:#F65D3C;"></i><span style="color: #F65D3C;"> প্রত্যাহার</span>-এ ক্লিক করে প্রত্যাহার করা যেতে পারে।</li>\
<li>যাদের সাথে একটি নোট শেয়ার করা হয়েছে সেই ব্যবহারকারী/গ্রুপের তালিকা দেখতে, <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">তালিকা</span>-তে ক্লিক করুন। \
যদি নোটের জন্য একটি মেয়াদ উত্তীর্ণের তারিখ সেট করা হয়, \
<i class="fa fa-clock-o" style="color:green"></i>, \
<i class="fa fa-clock-o" style="color:red"></i> \
এর মধ্যে একটি আইকনও এর নামের আগে প্রদর্শিত হবে।</li>\
<li><i class="fa fa-clock-o" style="color:green"></i> আইকনটি নির্দেশ করে \
যে নোটটি ভবিষ্যতে কয়েক দিন পরে মেয়াদ উত্তীর্ণ হবে। মেয়াদ উত্তীর্ণের তারিখ দেখতে, নোটের নামে ক্লিক করুন।</li> \
<li><i class="fa fa-clock-o" style="color:red"></i> আইকনটি নির্দেশ করে যে নোট শেয়ারের মেয়াদ উত্তীর্ণ হয়েছে। \
মেয়াদ উত্তীর্ণ নোটটি যে ব্যবহারকারী/গ্রুপের সাথে শেয়ার করা হয়েছিল তারা আর দেখতে পারবে না।</li>\
<li>নোট(গুলি) মুছতে, চেকবক্সে ক্লিক করে নোট(গুলি) নির্বাচন করুন এবং <i class="fa fa-times-circle" style="color:red"></i>\
<span style="border-radius:3px;">&nbsp;<b style="color:#ff0000;">মুছুন</b> </span>-এ ক্লিক করুন। \
একটি নোট মোছা হলে, অন্যদের সাথে শেয়ার করা কপিগুলি সহ সমস্ত কপি মুছে ফেলা হবে।</li> \
</ul>

notesSharedWithMeHelp=<ul style="padding-left:2px"> \
<li><span style="font-weight: bold">শেয়ার করেছেন</span> কলামটি দেখায় কে আপনার সাথে নোটটি শেয়ার করেছেন। \
একটি নোটের বিষয়বস্তু দেখতে, এর নামে ক্লিক করুন। \
নোটের তালিকা সাজাতে, <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;সাজান</span>-এ ক্লিক করুন।</li>\
<li>যদি আপনাকে একটি নোটে আপডেট করার অনুমতি দেওয়া হয়, আপনি <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> সম্পাদনা</span>-তে ক্লিক করে এটি সম্পাদনা করতে পারেন।</li> \
<li>নোট ত্যাগ করতে প্রথমে চেকবক্সে ক্লিক করে নোটগুলি নির্বাচন করুন। তারপর <i class="fa fa-chevron-circle-left" style="color:#F65D3C"></i><span style="color: #F65D3C;"> ত্যাগ করুন</span>-এ ক্লিক করুন। \
আপনাকে ত্যাগ করা নিশ্চিত করতে বলা হবে। \
একবার ত্যাগ করা হলে, নির্বাচিত নোটগুলি \
আর আপনার সাথে শেয়ার করা হবে না এবং আপনি সেগুলি অ্যাক্সেস করতে পারবেন না।</li>  \
</ul>

