aboutObidos = <div class="row"> \
<div class="col-md-12 col-xs-12 col-centered"> \
	<ul class="list-group"> \
		<li class="list-group-item">\
			&#8226; <a href="https://spenego.com">أوبيدوس من سبينيجو</a> \
			يوفر طريقة <b>لتخزين</b> المعلومات الحساسة (مثل: كلمات المرور، معلومات بطاقة الائتمان، إلخ) <b>بشكل آمن</b> \
			و<b>مشاركة</b> المعلومات <b>بشكل آمن</b>. يتم تشفير جميع المعلومات \
			باستخدام أفضل مكتبات التشفير في فئتها.<br/></li>\
		<li class="list-group-item">\
			&#8226; يمكن مشاركة المعلومات مع مستخدم واحد أو مجموعة. \
			يمكن وضع أنواع مختلفة من المعلومات في <span style="font-weight:bold;">حاوية</span> ويمكن \
			مشاركة الحاوية أيضًا. \
			يمكن لمالك المعلومات تفويض الملكية إلى مستخدمين آخرين. \
			يمكن للمالك أيضًا إلغاء المشاركة. \
			يمكن أن يكون للمعلومات المشتركة عمر افتراضي اختياري. </li> \
		<li class="list-group-item">\
			&#8226; لا يمكن لمسؤولي أوبيدوس الوصول إلى مفاتيح المستخدم أو البيانات المشفرة. يمكن للمسؤولين \
			فقط إدارة حسابات المستخدمين. \
			</li> \
	</ul> \
</div>  \
</div> \

