<li>بالنسبة للمستخدمين العاديين، ستكون هناك فترة سماح لمدة شهرين بعد انتهاء صلاحية الترخيص.</li> \
<li>خلال الشهر الأول من فترة السماح، سيعمل البرنامج بشكل طبيعي للمستخدمين.</li> \
<li>في الشهر الثاني من فترة السماح، سيتمكن المستخدمون من عرض \
