<li><font color="red">هذه الحاوية قابلة للمشاركة. قرر بعناية ما إذا كان يمكن مشاركة العنصر أم لا.</font></li> \
<li>إذا كان العنصر قابلاً للمشاركة، يمكن تحديد تاريخ انتهاء للمشاركة. هذا يعني أنه إذا تم تعيين تاريخ انتهاء، \
فسيختفي العنصر من قائمة المستلم بعد اليوم المحدد. \
إذا لم يتم تعيين <span style="font-weight: bold;">تاريخ انتهاء المشاركة</span>، فلن يكون للعنصر تاريخ انتهاء. \
سيكون لأيام الانتهاء تأثير فقط إذا تمت مشاركة العنصر مع شخص ما.</li></ul>

addItemToPrivateContainerHelp=<ul style="padding-left:2px"><li>الحقول ذات رمز فتح القفل <i class="fa fa-unlock" style="color:red"></i> يتم تخزينها كنص عادي. \
الحقول ذات رمز القفل <i class="fa fa-lock" style="color:green"></i> يتم تشفيرها ولا يمكن استخدامها في البحث.</li> \
<li><font color="red">بما أن هذه الحاوية خاصة، يمكن إنشاء عناصر خاصة فقط فيها.</font></li></ul>

listContainersHelp=<ul style="padding-left:2px"> \
<li>لرؤية قائمة العناصر في حاوية، انقر على اسم الحاوية. لتغيير اسم الحاوية، استخدم <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> تحرير</span>. يمكن مشاركة الحاوية مع الآخرين باستخدام إجراء <i class="fa fa-share-alt-square" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">مشاركة</span>.</li>\
<li> إذا تمت مشاركة الحاوية، سيتم عرض أيقونة <i class="fa fa-share-square" style="color:#1E8CFF;"></i> قبل اسم الحاوية. \
يمكن إلغاء مشاركة الحاوية التي تمت مشاركتها بالفعل باستخدام خيار <i class="fa fa-ban" style="color:#F65D3C"></i><span style="color: #F65D3C;"> إلغاء</span>.</li>\
<li>لرؤية قائمة المستخدمين/المجموعات الذين تمت مشاركة الحاوية معهم، انقر على <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">قائمة</span> تحت عمود <span style="font-weight: bold">تمت المشاركة مع</span>.</li>\
<li>لحذف الحاوية (الحاويات)، حدد أولاً الحاوية (الحاويات) بالنقر على مربعات الاختيار. \
ثم انقر على زر <i class="fa fa-times-circle" style="color:red"></i><span style="border-radius:3px;">&nbsp;<b style="color:#ff0000;">حذف</b> </span> \
أعلى القائمة. سيُطلب منك تأكيد الحذف. \
عند حذف حاوية، سيتم حذف جميع نسخ الحاوية بما في ذلك تلك المشتركة مع الآخرين (والعناصر الموجودة بداخلها) أيضًا.</li> \
</ul>createContainerHelp=<ul style="padding-right:2px"><li>الحاويات تحتوي على العناصر. من الناحية المثالية، يجب أن يحدد اسم الحاوية نوع العناصر التي ستحتويها. على سبيل المثال البنوك وبطاقات الائتمان والأنظمة وما إلى ذلك. يمكن تغيير اسم الحاوية لاحقًا.</li>\
<li>يمكن أن تكون الحاويات من نوع قابل للمشاركة أو خاص. يمكن مشاركة الحاويات القابلة للمشاركة فقط مع المستخدمين/المجموعات الأخرى.</li>\
<li><span style="font-weight: bold;color:#FF0000;">لا يمكن تغيير نوع الحاوية أبدًا</span>. لذا ستظل الحاوية الخاصة دائمًا خاصة وستظل الحاوية القابلة للمشاركة دائمًا قابلة للمشاركة.</li> \
<li>يمكن أن تكون العناصر داخل الحاويات القابلة للمشاركة قابلة للمشاركة أو خاصة. ومع ذلك، فإن العناصر داخل الحاوية الخاصة \
تكون دائمًا خاصة.</li> \
<li>إذا تمت مشاركة حاوية قابلة للمشاركة، فسيتم مشاركة العناصر القابلة للمشاركة داخل الحاوية فقط.</li></ul>

adminMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">المسؤولون</font></b></div></p> \
<p><b>إنشاء مسؤول جديد:</b> يمكن للمسؤولين الرئيسيين والمسؤولين الذين لديهم امتيازات إنشاء المسؤولين إنشاء مسؤولين جدد. ستكون عناصر القائمة هذه غير نشطة إذا لم يكن لدى المسؤول القدرة على القيام بذلك.</p> \
<p><b>إدارة المسؤول:</b> يسرد ملفات تعريف المسؤول، حيث يمكن تحرير المعلومات وقفل المسؤولين أو وضع علامة عليهم كمحذوفين. ستكون عناصر القائمة هذه غير نشطة إذا لم يكن لدى المسؤول القدرة على القيام بذلك.</p> \
<p><b>المسؤولون المقفلون:</b> يسرد المسؤولين المقفلين، ويعطي خيار إلغاء قفلهم. ستكون عناصر القائمة هذه غير نشطة إذا لم يكن لدى المسؤول القدرة على القيام بذلك.</p> \
<p><b>المسؤولون المحذوفون:</b> يسرد المسؤولين المحذوفين، ويعطي خيار استعادتهم. ستكون عناصر القائمة هذه غير نشطة إذا لم يكن لدى المسؤول القدرة على القيام بذلك.</p>\
</span>

usersMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">المستخدمون</font></b></div></p> \
<p>قائمة <b>إنشاء مستخدم جديد</b> هي لإنشاء حسابات مستخدمين جديدة من قبل المسؤول الرئيسي أو من قبل المسؤولين الذين لديهم القدرة على إنشاء حسابات المستخدمين.</p> \
<p>تُستخدم قائمة <b>إدارة المستخدمين</b> لتوفير قائمة بحسابات المستخدمين النشطة. يمكن تحرير الملف الشخصي أو بيانات اعتماد حساب المستخدم من هذه القائمة.</p>\
<p>تُستخدم قائمة <b>المستخدمون المقفلون</b> لتوفير قائمة بحسابات المستخدمين المقفلة. \
باستخدام هذه القائمة، يمكن إلغاء قفل حساب مستخدم مقفل. </p>\
<p>توفر قائمة <b>المستخدمون المحذوفون</b> قائمة بحسابات المستخدمين المحذوفة، وهي الحسابات التي تم وضع علامة عليها كمحذوفة. يمكن استعادة هذه الحسابات ولكن لا يمكن حذفها بشكل دائم في الوقت الحالي.</p>\
</span>

settingsMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">الإعدادات</font></b></div></p> \
<p>تُستخدم قائمة <b>إنشاء AD/LDAP</b> لتكوين تفاصيل أي دليل نشط للمؤسسة أو LDAP الذي يعد مصدرًا لبيانات اعتماد المستخدم. </p>\
<p>تسمح <b>إنشاء إعدادات SMTP</b> بتكوين بوابة البريد الإلكتروني للشركة حتى يتمكن Obidos من إرسال إشعارات البريد الإلكتروني. </p>\
<p>يمكن استخدام قائمة <b>إعدادات النظام</b> لتعيين إعدادات http/s، مُصدر المصادقة الثنائية، تنسيق التاريخ، سياسة كلمة المرور المحلية وسياسة العبارة المرورية. </p>\
<p>تتطلب واجهة الويب الأمامية لـ Obidos شهادة SSL. يمكن تثبيت هذه باستخدام قائمة <b>تثبيت شهادة SSL للويب</b> </p>\
<p>إذا تم تكوين الدليل النشط أو LDAP لاستخدام اتصال آمن، فيجب تثبيت الشهادة المستخدمة لهذا الاتصال الآمن \
على جانب Obidos. تسهل قائمة <b>تثبيت شهادة خادم AD/LDAP</b> هذا.</p>\
<p>يمكن تثبيت ترخيص البرنامج لـ Obidos باستخدام قائمة <b>تثبيت ترخيص Obidos</b>. يمكن \
الحفاظ على الخدمة دون انقطاع عن طريق تثبيت ترخيص الترقية قبل انتهاء صلاحية الترخيص الحالي. </p>\
</span>

auditMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">التدقيق</font></b></div></p> \
<p>يعرض تقرير التدقيق تقريرًا ثابتًا عن النظام بشكل عام.</p> \
<p>تسمح سجلات التدقيق برؤية أنشطة مستخدمين محددين أو حدوث أحداث معينة. \
لتضييق نطاق البحث، يمكن تحديد النشاط المهم. وإلا سيتم عرض جميع الأنشطة بشكل افتراضي. \
يمكن اختيار الفترة المهمة من التقويم. </p>\
</span>

notesMenuHelpTitle=الملاحظات
notesMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">الملاحظات</font></b></div></p> \
<p>الملاحظة هي نظير ملاحظة لاصقة. للملاحظة اسم ومحتوى. يمكن أن تكون الملاحظات مستقلة أو موضوعة داخل حاويات. في هذا القسم، نشرح القوائم المتاحة للملاحظات المستقلة.</p> \
<p>لكل شاشة مساعدة خاصة بها يمكن الوصول إليها بالنقر على زر <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-info-circle" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;مساعدة&nbsp</span></span> في أعلى يمين اللوحة. \
بمجرد الانتقال إلى شاشة المستوى الأدنى، للعودة إلى الشاشة السابقة، استخدم زر <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-arrow-circle-left" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;رجوع&nbsp</span></span> في أعلى يسار اللوحة. </p>\
<p>التنقل عبر قوائم القائمة متشابه وموصوف هنا. \
افتراضيًا، سيتم عرض الملاحظات بالترتيب الذي تم إنشاؤها به مع أحدثها في الأعلى. \
لفرز قائمة الملاحظات بترتيب آخر، انقر على أيقونة <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;فرز</span> أعلى شريط القائمة. \
في أسفل الشاشة سيظهر عدد الملاحظات الموجودة. \
على سبيل المثال، إذا كان هناك 23 ملاحظة و14 مدرجة في الشاشة الحالية، ستشاهد في أسفل الشاشة \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> 1-14 من 23 <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
للتحرك للأمام في القائمة واحدة تلو الأخرى، انقر على <img src="/images/simplePagerNextPage.png">. \
للتحرك للأمام صفحة كاملة، انقر على <img src="/images/simplePagerLastPage.png">. \
وبالمثل، للعودة في القائمة واحدة تلو الأخرى، انقر على <img src="/images/simplePagerPreviousPage.png"> \
وللعودة صفحة كاملة واحدة، انقر على <img src="/images/simplePagerFirstPage.png">. \
لرؤية محتويات ملاحظة، انقر على اسمها. </p>\
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">إنشاء ملاحظة جديدة</font></b></span></p> \
<p>تُستخدم قائمة <b><font color="blue">إنشاء ملاحظة جديدة</font></b> لإنشاء ملاحظة. يمكن تعيين اسم للملاحظة. يمكن استخدام هذا الاسم في البحث للعثور على ملاحظة محددة من مجموعة جميع الملاحظات المملوكة للمستخدم. محتوى الملاحظة هو النص المرتبط بالملاحظة. يتم تخزين المحتوى مشفرًا.</p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">ملاحظاتي</font></b></span></p> \
<p>تعرض قائمة <b><font color="blue">ملاحظاتي</font></b> قائمة بجميع الملاحظات المستقلة المملوكة للمستخدم. \
إذا تمت مشاركة ملاحظة مع مستخدمين/مجموعات أخرى، ستظهر الأيقونة <i class="fa fa-share-square" style="color:#1E8CFF;"></i> قبل اسم الملاحظة. \
لرؤية قائمة المستخدمين/المجموعات الذين تمت مشاركة الملاحظة معهم، انقر على <i class="fa fa-users" style="color:#1E8CFF;"></i> <span style="color: #1E8CFF;">قائمة</span>. </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">ملاحظاتي المشتركة مع الآخرين</font></b></span></p> \
<p>تسرد قائمة <b><font color="blue">ملاحظاتي المشتركة مع الآخرين</font></b> جميع الملاحظات التي تمت مشاركتها مع مستخدمين/مجموعات أخرى. العمليات على كل ملاحظة هي نفسها تمامًا مثل العمليات تحت قائمة "ملاحظاتي". </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">الملاحظات المشتركة معي</font></b></span></p> \
<p>تسرد قائمة <b><font color="blue">الملاحظات المشتركة معي</font></b> جميع الملاحظات التي شاركها الآخرون مع المستخدم. \
يوضح عمود <span style="font-weight: bold">مشاركة بواسطة</span> من شارك الملاحظة معك. \
إذا منح مالك الملاحظة أذونات تحرير على الملاحظة، يمكنك استخدام <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> تحرير</span> لتغيير محتويات الملاحظة. </p>\
</span>

historyMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">التاريخ</font></b></div></p> \
<p>يمكن عرض تاريخ الأنشطة خلال فترة زمنية محددة بشكل انتقائي.</p> \
<p>يمكن تحديد النشاط المطلوب. وإلا سيتم عرض جميع الأنشطة افتراضيًا. \
يمكن اختيار الفترة المطلوبة من التقويم. </p>\
</span>

createNoteHelp=<ul style="padding-left: 2px"><li>اسم الملاحظة غير مشفر ويمكن استخدامه في البحث. تشير أيقونة القفل المفتوح الأحمر <i class="fa fa-unlock" style="color:red"></i> إلى أن \
اسم الملاحظة مخزن بدون تشفير.</li>\
<li>يتم الاحتفاظ بمحتوى الملاحظة مشفرًا كما هو موضح بأيقونة <i class="fa fa-lock" style="color:green"></i> الخضراء. وبالتالي لا يمكن البحث فيه. سيتم تنظيف أي XSS في محتوى الملاحظة قبل الحفظ.</li> \
<li>يمكن مشاركة الملاحظة القابلة للمشاركة فقط مع مستخدمين/مجموعات أخرى. الملاحظة الخاصة ستظل دائمًا خاصة.</li>\
<li>بالنسبة للملاحظة القابلة للمشاركة، يمكن تعيين تاريخ انتهاء الصلاحية. عند مشاركة الملاحظة مع شخص ما، ستنتهي صلاحية الملاحظة في ذلك التاريخ. يمكن تغيير تاريخ انتهاء الصلاحية في أي وقت.</li>\
</ul>

listNotesHelp=<ul style="padding-left:2px">\
<li>لرؤية محتويات ملاحظة، انقر على اسمها. لفرز قائمة الملاحظات، انقر على <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;فرز</span>. \
استخدم <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> تحرير</span> لتغيير اسم/محتويات ملاحظة. </li> \
<li>لمشاركة ملاحظة مع الآخرين، انقر على <i class="fa fa-share-alt-square" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">مشاركة</span>. \
بمجرد مشاركة ملاحظة، ستظهر أيقونة <i class="fa fa-share-square" style="color:#1E8CFF;"></i> قبل اسمها. \
يمكن إلغاء مشاركة ملاحظة مشتركة بالنقر على <i class="fa fa-ban" style="color:#F65D3C;"></i><span style="color: #F65D3C;"> إلغاء</span>.</li>\
<li>لسرد المستخدمين/المجموعات الذين تمت مشاركة ملاحظة معهم، انقر على <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">قائمة</span>. \
إذا تم تعيين يوم انتهاء الصلاحية للملاحظة، ستظهر إحدى الأيقونات \
<i class="fa fa-clock-o" style="color:green"></i>، \
<i class="fa fa-clock-o" style="color:red"></i> \
أيضًا قبل اسمها. </li>\
<li>تشير أيقونة <i class="fa fa-clock-o" style="color:green"></i> إلى \
أن الملاحظة ستنتهي صلاحيتها بعد بضعة أيام في المستقبل. لرؤية تاريخ انتهاء الصلاحية، انقر على اسم الملاحظة.</li> \
<li>تشير أيقونة <i class="fa fa-clock-o" style="color:red"></i> إلى أن مشاركة الملاحظة قد انتهت صلاحيتها. \
لن تكون الملاحظة منتهية الصلاحية قابلة للعرض من قبل المستخدمين/المجموعات الذين تمت مشاركة الملاحظة معهم. </li>\
<li>لحذف ملاحظة (ملاحظات)، حدد الملاحظة (الملاحظات) بالنقر على مربعات الاختيار وانقر على <i class="fa fa-times-circle" style="color:red"></i>\
<span style="border-radius:3px;">&nbsp;<b style="color:#ff0000;">حذف</b> </span>. \
عند حذف ملاحظة، سيتم حذف جميع النسخ بما في ذلك تلك المشتركة مع الآخرين.</li> \
</ul>

notesSharedWithMeHelp=<ul style="padding-left:2px"> \
<li>يوضح عمود <span style="font-weight: bold">مشاركة بواسطة</span> من شارك الملاحظة معك. \
لرؤية محتويات ملاحظة، انقر على اسمها. \
لفرز قائمة الملاحظات، انقر على <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;فرز</span>. </li>\
<li>إذا تم منحك إذن التحديث على ملاحظة، يمكنك تحريرها بالنقر على <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> تحرير</span>. </li> \
<li>للتخلي عن الملاحظات، حدد الملاحظات بالنقر على مربعات الاختيار أولاً. ثم انقر على <i class="fa fa-chevron-circle-left" style="color:#F65D3C"></i><span style="color: #F65D3C;"> تخلي</span>. \
سيُطلب منك تأكيد التخلي. \
بمجرد التخلي، لن تتم مشاركة الملاحظات المحددة \
معك بعد الآن ولن تتمكن من الوصول إليها. </li>  \
</ul>
