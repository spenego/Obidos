templatesMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">القوالب</font></b></div></p> \
<p>يصف القالب تخطيط العنصر. يتكون كل قالب من أزواج متعددة من &lt;الحقل،القيمة&gt;. يمكن أن يكون هناك أي عدد من الحقول وتستخدم كدليل لإنشاء العناصر. \
على سبيل المثال، يمكن أن يحتوي قالب يسمى "حساب البريد الإلكتروني" على حقول "الرابط" و"اسم المستخدم" و"كلمة المرور". \
<p> عند استخدام قالب لإنشاء عنصر، سيتم عرض الحقول المحددة مسبقًا وما على المستخدم \
سوى توفير قيم لتلك الحقول. \
على سبيل المثال، \
عند استخدام قالب "حساب البريد الإلكتروني" لإنشاء عنصر يسمى "البريد الإلكتروني الشخصي"، يجب على المستخدم \
توفير قيم للحقول الرابط واسم المستخدم وكلمة المرور. \
<p>يمكن أن تكون القوالب عامة أو شخصية. يجب تحديد حقول القالب الشخصي من قبل المستخدم. \
من الممكن أيضًا نسخ قالب عام إلى قالب شخصي للتخصيص. \
يمكن للمستخدمين إنشاء/تعديل/حذف قوالبهم الشخصية. \
يأتي Obidos مع عدد من القوالب العامة المحددة مسبقًا. \
يمكن فقط للمستخدمين الذين لديهم أذونات إنشاء/تعديل/حذف القوالب العامة.</p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">إنشاء قالب شخصي جديد</font></b></span></p> \
<p>تستخدم قائمة <b><font color="blue">إنشاء قالب شخصي جديد</font></b> لإنشاء قالب شخصي جديد. يمكن تعيين اسم للقالب. \
يمكن استخدام هذا الاسم في البحث للعثور على قالب معين من مجموعة كل القوالب الشخصية التي يملكها المستخدم. </p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">القوالب الشخصية</font></b></span></p> \
<p>تستخدم قائمة <b><font color="blue">القوالب الشخصية</font></b> للحصول على قائمة بجميع القوالب الشخصية التي يملكها المستخدم. \
سيتم عرض القوالب بالترتيب الذي تم إنشاؤها به مع وضع الأحدث في الأعلى. \
في أسفل الشاشة، سيتم إظهار عدد القوالب الموجودة. \
على سبيل المثال، إذا كان هناك 17 قالبًا شخصيًا و14 مدرجًا في الشاشة، فسترى \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> 1-14 من 17 <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
<p>للتنقل للأمام في القائمة واحدة تلو الأخرى، انقر على <img src="/images/simplePagerNextPage.png">. \
للانتقال للأمام صفحة كاملة من القوالب، انقر على <img src="/images/simplePagerLastPage.png">. \
وبالمثل، للعودة في القائمة قالب واحد في كل مرة، انقر على <img src="/images/simplePagerPreviousPage.png"> \
وللعودة صفحة كاملة من القوالب، انقر على <img src="/images/simplePagerFirstPage.png">. </p> \
</span>
