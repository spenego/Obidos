بمجرد الإلغاء، لن يتمكن المستخدم أو المستخدمون في المجموعة من الوصول إلى العنصر بعد ذلك. </li>  \
<li>يمكن أيضًا تحديد المستخدمين والمجموعات المعنية عن طريق البحث عنهم بناءً على جزء/سلسلة فرعية من أسمائهم. </li> \
