newUserHelp=<ul style="padding-left:2px"><li>يمكن أن يحتوي اسم المستخدم على أحرف كبيرة وصغيرة وأرقام و _ و - و .</li><li>يمكن أن يكون مصدر المصادقة <b>محلي</b> أو <b>Active Directory/LDAP (فقط إذا تم تكوينه)</b></li><li>يجب إخبار المستخدم بكلمة المرور الأولية</li><li>سيُطلب من المستخدم تغيير كلمة المرور عند أول تسجيل دخول باستخدام كلمة المرور الأولية إذا كانت كلمة المرور <b>محلية</b></li><li>يتم استخدام عنوان البريد الإلكتروني الرئيسي للتواصل مع المستخدم وأيضًا لإخطار المستخدم بشأن الحساب إذا تم تحديده. يمكنك إضافة تعليمات إضافية في تعليق البريد الإلكتروني والتي سيتم إضافتها في البريد. استخدم <a href="#PICK_NOTIFICAITON_TEMPLATE">تعديل قوالب البريد الإلكتروني</a> لتحديث قالب البريد المحدد</li><li>يتم استخدام رقم الهاتف المحمول لإرسال إشعارات SMS عندما يشارك شخص ما ملاحظات أو عناصر وما إلى ذلك مع المستخدم. يجب أن يكون الرقم رقمًا صالحًا بتنسيق <a href="https://www.twilio.com/docs/glossary/what-e164" target="_blank">E.164</a>. سيتم إرسال إشعار SMS إذا وافق المستخدم على قبول الرسائل القصيرة في الملف الشخصي</li></ul>
