shareContainerWithGroupsHelp=<ul style="padding-left:2px"> \
<li>لمشاركة الحاوية، حدد المجموعة (المجموعات) المعنية بالنقر على مربعات الاختيار. ثم انقر على <i class="fa fa-share-alt-square" style="color:green"></i>&nbsp;<b style="color:green;">مشاركة</b>. </li> \
<li>يمكن البحث عن مجموعة بناءً على اسم المجموعة. أدخل سلسلة فرعية/جزء من اسم المجموعة في مربع البحث وانقر على <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. على سبيل المثال، إذا كان اسم المجموعة هو ''أصدقاء اليوغا''، \
فإن إدخال يوغا في شريط البحث سيعرض معلومات المجموعة. حدد المجموعة بالنقر على مربع الاختيار ثم شارك الحاوية.</li> \
</ul>
revokeContainerSharingHelp = <ul style="padding-left:2px"> \
<li> لإلغاء مشاركة الحاوية من مستخدم أو مجموعة، حدد المستخدم أو المجموعة بالنقر على مربع الاختيار. \
ثم انقر على  <i class="fa fa-ban" style="color:#F65D3C;"></i><span style="color: #F65D3C;"> إلغاء</span>.</li> \
<li>يمكن البحث عن مستخدم بالاسم. أدخل جزءًا من الاسم الكامل في مربع البحث و \
انقر على <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. على سبيل المثال، إذا كان الاسم الكامل للمستخدم هو أكوا مارين، \
فإن إدخال "كوا" في شريط البحث سيعرض معلومات المستخدم. يمكن تحديد المستخدم بالنقر على مربع الاختيار ثم إلغاء الحاوية.</li> \
<li>يمكن البحث عن مجموعة استنادًا إلى اسم المجموعة. أدخل جزءًا من اسم المجموعة في مربع البحث وانقر على <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. على سبيل المثال، إذا كان اسم المجموعة "أصدقاء اليوغا"، \
فإن إدخال "يوغا" في شريط البحث سيعرض معلومات المجموعة. حدد المجموعة بالنقر على مربع الاختيار ثم قم بإلغاء الحاوية.</li> \
</ul>

revokeContainerFromUsersHelp=<ul style="padding-left:2px"> \
<li>لإلغاء الحاوية، حدد المستخدم (المستخدمين) المعنيين بالنقر على مربعات الاختيار. ثم انقر على  <i class="fa fa-ban" style="color:#F65D3C;"></i><span style="color: #F65D3C;"> إلغاء</span>. </li>\
<li>يمكن البحث عن مستخدم استنادًا إلى الاسم الكامل. أدخل جزءًا من الاسم الكامل في مربع البحث وانقر على <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. على سبيل المثال، إذا كان الاسم الكامل للمستخدم هو أكوا مارين، \
فإن إدخال "كوا" في شريط البحث سيعرض معلومات المستخدم. يمكن تحديد المستخدم بالنقر على مربع الاختيار ثم إلغاء الحاوية.</li> \
</ul>

