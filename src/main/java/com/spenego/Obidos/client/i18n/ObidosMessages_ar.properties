containersMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">الحاويات</font></b></div></p> \
<p>تحتوي الحاوية على عناصر. يمكن أن تكون الحاوية خاصة أو قابلة للمشاركة. يمكن تخزين العناصر الخاصة فقط في حاوية خاصة. \
تبقى العناصر في الحاوية الخاصة مخفية عن المستخدمين الآخرين. \
يمكن أن تحتوي الحاوية القابلة للمشاركة على عناصر خاصة وقابلة للمشاركة. \
عند مشاركة حاوية قابلة للمشاركة مع الآخرين، ستكون العناصر القابلة للمشاركة فقط في الحاوية مرئية لهم. \
<p>كل شاشة لها مساعدة خاصة بها يمكن الوصول إليها بالنقر على زر <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-info-circle" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;مساعدة&nbsp</span></span> في أعلى يمين اللوحة. \
بمجرد الانتقال إلى شاشة المستوى الأدنى، للعودة إلى الشاشة السابقة، استخدم زر <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-arrow-circle-left" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;رجوع&nbsp</span></span> في أعلى يسار اللوحة. </p>\
<p>التنقل عبر قوائم القائمة متشابه وموضح هنا. \
بشكل افتراضي، سيتم عرض الحاويات بالترتيب الذي تم إنشاؤها به مع وضع الأحدث في الأعلى. \
لفرز قائمة الحاويات بترتيب آخر، انقر على أيقونة <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;فرز</span> فوق شريط القائمة. \
في أسفل الشاشة سيتم عرض عدد الحاويات الموجودة. \
على سبيل المثال، إذا كان هناك 20 حاوية و14 منها مدرجة في الشاشة الحالية، سترى في أسفل الشاشة \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> 1-14 من 20 <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
للتحرك إلى الأمام في القائمة واحدة تلو الأخرى، انقر على <img src="/images/simplePagerNextPage.png">. \
للتحرك إلى الأمام صفحة كاملة، انقر على <img src="/images/simplePagerLastPage.png">. \
وبالمثل، للعودة في القائمة واحدة تلو الأخرى، انقر على <img src="/images/simplePagerPreviousPage.png"> \
وللعودة صفحة كاملة واحدة، انقر على <img src="/images/simplePagerFirstPage.png">. \
لرؤية العناصر في حاوية، انقر على اسمها. </p>\
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">إنشاء حاوية جديدة</font></b></span></p> \
<p>تُستخدم قائمة <b><font color="blue">إنشاء حاوية جديدة</font></b> لإنشاء حاوية. يمكن تعيين اسم للحاوية. \
يمكن استخدام هذا الاسم في البحث للعثور على حاوية معينة من مجموعة جميع الحاويات المملوكة للمستخدم. </p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">حاوياتي</font></b></span></p> \
<p>تُستخدم قائمة <b><font color="blue">حاوياتي</font></b> للحصول على قائمة بجميع الحاويات المملوكة للمستخدم. \
لرؤية قائمة المستخدمين/المجموعات الذين تمت مشاركة الحاوية معهم، انقر على <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">قائمة</span>. </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">حاوياتي المشتركة مع الآخرين</font></b></span></p> \
<p>تسرد قائمة <b><font color="blue">حاوياتي المشتركة مع الآخرين</font></b> جميع الحاويات التي تمت مشاركتها مع مستخدمين/مجموعات أخرى. \
التنقل عبر القائمة مشابه لتفاصيل التنقل الموضحة تحت قائمة "حاوياتي". </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">الحاويات المشتركة معي</font></b></span></p> \
<p>تسرد قائمة <b><font color="blue">الحاويات المشتركة معي</font></b> جميع العناصر التي شاركها الآخرون مع المستخدم.</p> \
</span>
