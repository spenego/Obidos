groupsMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">المجموعات</font></b></div></p> \
<p>يمكن للمستخدمين إنشاء مجموعات من المستخدمين. ستسهل المجموعات مشاركة ملاحظة أو عنصر/حاوية مع عدة مستخدمين. \
يمكن إضافة المستخدمين فقط كأعضاء في المجموعة. لا يمكن إضافة مجموعة أخرى كعضو في مجموعة. </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">إنشاء مجموعة جديدة</font></b></span></p> \
<p>يتم استخدام قائمة <b><font color="blue">إنشاء مجموعة جديدة</font></b> لإنشاء مجموعة جديدة من المستخدمين. يمكن تعيين اسم للمجموعة. \
يمكن استخدام هذا الاسم في البحث للعثور على مجموعة معينة من مجموعة كل المجموعات التي يملكها المستخدم. </p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">مجموعاتي</font></b></span></p> \
<p>تستخدم قائمة <b><font color="blue">مجموعاتي</font></b> للحصول على قائمة بجميع المجموعات التي يملكها المستخدم. \
سيتم عرض المجموعات بالترتيب الذي تم إنشاؤها به مع وضع الأحدث في الأعلى. \
في أسفل الشاشة، سيتم إظهار عدد المجموعات الموجودة. \
على سبيل المثال، إذا كان هناك 17 مجموعة و14 مدرجة في الشاشة، فسترى \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> 1-14 من 17 <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
<p>للتنقل للأمام في القائمة واحدة تلو الأخرى، انقر على <img src="/images/simplePagerNextPage.png">. \
للانتقال للأمام صفحة كاملة من المجموعات، انقر على <img src="/images/simplePagerLastPage.png">. \
وبالمثل، للعودة في القائمة مجموعة واحدة في كل مرة، انقر على <img src="/images/simplePagerPreviousPage.png"> \
وللعودة صفحة كاملة من المجموعات، انقر على <img src="/images/simplePagerFirstPage.png">. </p> \
</span>
