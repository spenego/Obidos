يتم استخدام تقنية تسمى <a href="https://blog.cloudflare.com/validating-leaked-passwords-with-k-anonymity/" target="_blank">k-Anonymity</a> للتحقق من كلمة المرور دون الكشف عن كلمة المرور نفسها. \
سيكون الاتصال بالشبكة مطلوبًا</li>\
</ul>
