createPersonalTemplateHelp= <ul style="padding-right:2px"><li>تلتقط القوالب هيكل العناصر المستخدمة بشكل متكرر. \
من الأمثلة الشائعة <b>بطاقات الائتمان</b>، <b>بيانات اعتماد تسجيل الدخول إلى مواقع الويب</b> وما إلى ذلك.</li>  \
<li>تحتوي القوالب على الحقول المحددة فيها. على سبيل المثال، يمكن أن يحتوي قالب بطاقة الائتمان على <b>رقم بطاقة الائتمان</b>، <b>الاسم على بطاقة الائتمان</b>، <b>تاريخ انتهاء الصلاحية</b> وما إلى ذلك.</li> \
<li>يمكن تغيير اسم القالب والحقول وترتيب العرض في أي وقت. ستؤثر هذه التغييرات فقط على العناصر الجديدة. يمكن استخدام اسم القالب في البحث.</li> \
<li>يمكن استخدام القوالب الشخصية فقط من قبل المالك وغير مرئية للمستخدمين الآخرين.</li> \
<li>لفتح صف جديد لاسم الحقل وترتيب العرض، <b>اضغط على ENTER</b> أثناء وجودك في مربع النص <b>اسم الحقل</b> أو انقر على زر <i class="fa fa-plus-square" style="color:#17a2b8"></i></li> \
</ul>

createGlobalTemplateHelp= <ul style="padding-right:2px"><li>يلتقط القالب الهيكل المشترك للعناصر. \
