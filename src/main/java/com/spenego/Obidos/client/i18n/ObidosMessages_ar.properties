listPersonalTemplatesHelp=<ul style="padding-left:2px"> \
<li>لرؤية الحقول في القالب، انقر على اسمه تحت <span style="font-weight:bold;">اسم القالب</span>. \
يمكن استخدام <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> تعديل</span> لتغيير الاسم أو الحقول أو ترتيب عرض الحقول في القالب.</li>\
<li>يمكن استخدام <i class="fa fa-copy" style="color:#F65D3C"></i><span style="color: #1E8CFF;"> نسخ</span> لنسخ قالب لمزيد من التعديلات أو التكييفات. \
لحذف قالب، حدده وانقر على <i class="fa fa-times-circle" style="color:red"></i><span style="border-radius:3px;color:#ff0000;font-weight:bold;">&nbsp;حذف</span>. </li> \
<li>عند حذف قالب، يتم الاحتفاظ بالعناصر الموجودة التي تم إنشاؤها باستخدام هذا القالب. سيتم إزالة القالب نفسه من الاستخدام المستقبلي.</li></ul>

listGlobalTemplatesHelp=<ul style="padding-left:2px"> \
<li>لرؤية الحقول في القالب، انقر على اسمه تحت <span style="font-weight:bold;">اسم القالب</span>. \
يمكن استخدام <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> تعديل</span> لتغيير الاسم أو الحقول أو ترتيب عرض الحقول في القالب.</li>\
<li>يمكن استخدام <i class="fa fa-copy" style="color:#F65D3C"></i><span style="color: #1E8CFF;"> نسخ</span> لنسخ قالب لمزيد من التعديلات أو التكييفات. \
لحذف قالب، حدده وانقر على <i class="fa fa-times-circle" style="color:red"></i><span style="border-radius:3px;color:#ff0000;font-weight:bold;">&nbsp;حذف</span>. </li> \
<li>عند حذف قالب، يتم الاحتفاظ بالعناصر الموجودة التي تم إنشاؤها باستخدام هذا القالب. سيتم إزالة القالب نفسه من الاستخدام المستقبلي.</li></ul>

containersSharedWithMeHelp=<ul style="padding-left:2px"> \
<li>لسرد العناصر في حاوية، انقر على اسمها. يسرد عمود <span style="font-weight: bold">تمت المشاركة بواسطة</span> الشخص الذي شارك الحاوية معك. </li> \
<li>للتخلي عن الحاوية (الحاويات)، حدد أولاً الحاوية (الحاويات) باستخدام مربعات الاختيار. ثم انقر على <i class="fa fa-chevron-circle-left" style="color:#F65D3C"></i><span style="color: #F65D3C;"> تخلي</span>. \
سيُطلب منك تأكيد التخلي. بمجرد التخلي، لن يكون لديك حق الوصول إلى الحاوية (الحاويات).</li> \
</ul>

