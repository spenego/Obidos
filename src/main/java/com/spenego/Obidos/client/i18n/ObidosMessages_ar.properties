<li> بمجرد انتهاء فترة السماح لمدة شهرين، لا يمكن عرض أو إنشاء أو تعديل أو مشاركة أي عنصر.</li> \
<li> يمكن عرض تفاصيل الترخيص من قائمة <i>اسمك -&gt; عرض الترخيص</i></li>
