editSettingsHelp = <ul style="padding-left:2px">\
<li>يمكن للمسؤول فقط تحديث إعدادات <span style="font-weight:bold;">الاسم الكامل</span> و<span style="font-weight:bold;">البريد الإلكتروني الأساسي</span> و<span style="font-weight:bold;">المصادقة الثنائية</span>. يتم عرضها للمعلومات فقط. \
<span style="font-weight:bold;">الصفحة الرئيسية</span> هي الصفحة الأولى التي تراها عند تسجيل الدخول.</li>\
<li>قم بتشغيل <span style="font-weight:bold;">قبول إشعار البريد الإلكتروني</span> لتلقي بريد إلكتروني \
عند مشاركة عنصر أو إلغاء مشاركته.</li>\
<li>قم بتشغيل <span style="font-weight:bold;">قبول إشعار الرسائل القصيرة</span> لتلقي رسالة نصية \
عند مشاركة عنصر أو إلغاء مشاركته. ملاحظة: حدد رقم هاتفك المحمول الصالح القادر على استقبال الرسائل القصيرة لتلقي الرسائل النصية. \
<b>يجب أن يجتاز رقم الهاتف المحمول تحقق <a href="https://www.twilio.com/docs/glossary/what-e164" target="_blank">E.164</a></b>.\
</li> \
<li>عند عرض عنصر، يمكنك ضبط مؤقت لإخفاء العنصر بعد الوقت المحدد (الافتراضي: 10 ثوانٍ). \
قد تخرج في بعض الأحيان تاركًا معلوماتك الخاصة معروضة. \
لذا من الجيد ضبط هذا المؤقت باستخدام <span style="font-weight:bold;">مدة مؤقت الخصوصية</span>. \
يمكن أيضًا إيقاف المؤقت أثناء عرض العنصر. \
أدخل 0 إذا كنت تريد تعطيل مؤقت الخصوصية. </li> \
<li>عند تغيير قيمة حقل في النموذج، سيتغير لون التسمية. \
انقر على زر <span style="font-weight:bold;background-color:#5b616b;color:#ffffff;border-radius:3px;">&nbsp;إعادة تعيين&nbsp;</span> \
لاستعادة الإعدادات الأصلية.</li>\
<li>يستخدم تحميل الصور واجهة برمجة تطبيقات الملفات HTML5. لذلك يمكن تحميل الصور باستخدام المتصفحات التي تدعم واجهة برمجة التطبيقات هذه. تدعم أحدث إصدارات Chrome وFireFox وSafari على سطح المكتب واجهة برمجة تطبيقات الملفات HTML5. لا يمكن أن تكون صورة الملف الشخصي أكبر من 20480 بايت. للحصول على تجربة أفضل وجودة صورة أفضل، استخدم صورة JPEG بحجم 128×128. إذا كانت الصورة أصغر من 2048 بايت ولكن أبعادها أكبر من 128×128، سيتم تغيير حجم الصورة. \
<b>ملاحظة: إذا لم يتم تحديث منطقة المعاينة بعد اختيار الصورة، فهذا يعني أن هناك خطأ ما في الصورة ولا يمكن معاينتها</b>. \
</li> \
</ul>
