twoFactorAuthenticationHelp = <ul style="padding-left:2px"><li><span style="font-weight:bold;">خوارزمية كلمة المرور لمرة واحدة المعتمدة على الوقت</span> \
 (TOTP) <a href="https://tools.ietf.org/html/rfc6238" target="_blank">RFC-6238</a> \
مدعومة لإعادة تعيين كلمة المرور وعبارة المرور. </li>\
<li> تتطلب TOTP استخدام أحد تطبيقات المصادقة المجانية \
مثل Google Authenticator أو Authy أو Microsoft Authenticator \
 على هاتف iOS/Android.</li>\
<li>تمكين المصادقة الثنائية هي عملية من 4 خطوات:</li>\
<ol>\
<li>قم بتنزيل وتثبيت تطبيق Google Authenticator أو Authy أو Microsoft Authenticator في هاتفك.</li>\
<li>قم بإنشاء سر بالنقر على <span style="border-radius:3px;background-color:#169c39;color:#ffffff;font-weight:bold;">&nbsp;&nbsp;إنشاء سر للمصادقة الثنائية &nbsp;</span>. سيتم تخزين السر بشكل آمن في الخادم.</li> \
<li>أضف السر المعروض هنا في Obidos إلى تطبيق المصادقة في هاتفك.</li> \
<li>أخيرًا، أدخل الرمز الرقمي الظاهر على تطبيق المصادقة هنا. إذا كان الرمز صالحًا، سيتم تمكين المصادقة الثنائية.</li>\
</ol>\
</ul>
