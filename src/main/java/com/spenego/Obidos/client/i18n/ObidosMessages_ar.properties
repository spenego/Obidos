</ul>

itemsMenuHelpTitle=العناصر
itemsMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">العناصر</font></b></div></p> \
<p>العنصر هو نسخة من قالب أو مجموعة مخصصة من أزواج &lt;الحقل,القيمة&gt; أو ملاحظة. يتم وضع كل عنصر داخل حاوية.</p>\
<p>كل شاشة لديها مساعدة خاصة بها يمكن الوصول إليها بالنقر على أيقونة <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-info-circle" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;مساعدة&nbsp</span></span> في أعلى يمين اللوحة. \
بمجرد الانتقال إلى شاشة المستوى الأدنى، للعودة إلى الشاشة السابقة، استخدم زر <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-arrow-circle-left" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;رجوع&nbsp</span></span> في أعلى يسار اللوحة. </p>\
<p>التنقل عبر قوائم القائمة متشابه وموصوف هنا. \
بشكل افتراضي، سيتم عرض العناصر بالترتيب الذي تم إنشاؤها به مع أحدثها في الأعلى. \
لفرز قائمة العناصر بترتيب آخر، انقر على أيقونة <i class="fa fa-sort" style="color:blue;"></i><span style="color: blue;">فرز</span> أعلى شريط القائمة. \
في أسفل الشاشة سيتم عرض عدد العناصر الموجودة. \
على سبيل المثال، إذا كان هناك 43 عنصرًا و12 مدرجًا في الشاشة الحالية، فسترى في أسفل الشاشة \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> 1-12 من 43 <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
للتحرك للأمام في القائمة واحدًا تلو الآخر، انقر على <img src="/images/simplePagerNextPage.png">. \
للتحرك للأمام صفحة كاملة، انقر على <img src="/images/simplePagerLastPage.png">. \
وبالمثل، للعودة في القائمة واحدًا تلو الآخر، انقر على <img src="/images/simplePagerPreviousPage.png"> \
وللعودة صفحة كاملة واحدة، انقر على <img src="/images/simplePagerFirstPage.png">. \
لعرض العنصر، انقر على اسمه. </p>\
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">إنشاء عنصر جديد</font></b></span></p> \
<p>تُستخدم قائمة <b><font color="blue">إنشاء عنصر جديد</font></b> لإنشاء عنصر. يمكن تعيين اسم للعنصر. \
يمكن استخدام هذا الاسم في البحث للعثور على عنصر معين من مجموعة جميع العناصر المملوكة للمستخدم. </p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">عناصري</font></b></span></p> \
<p>تُستخدم قائمة <b><font color="blue"> عناصري</font></b> للحصول على قائمة بجميع العناصر من جميع الحاويات المملوكة للمستخدم. \
إذا تمت مشاركة عنصر مع مستخدمين/مجموعات أخرى، ستظهر الأيقونة <i class="fa fa-share-square" style="color:green"></i> قبل اسم العنصر. \
لرؤية قائمة المستخدمين/المجموعات الذين تمت مشاركة العنصر معهم، انقر على <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">قائمة</span>. </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">عناصري المشتركة مع الآخرين</font></b></span></p> \
<p>تسرد قائمة <b><font color="blue">عناصري المشتركة مع الآخرين</font></b> جميع العناصر التي تمت مشاركتها مع مستخدمين/مجموعات أخرى. العمليات على كل عنصر هي نفسها تمامًا مثل العمليات تحت قائمة "عناصري". </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">العناصر المشتركة معي</font></b></span></p> \
<p>تسرد قائمة <b><font color="blue">العناصر المشتركة معي</font></b> جميع العناصر التي شاركها الآخرون مع المستخدم.</p> \
</span>

createNewItemHelp=<ul style="padding-right:2px">\
<li>عند إنشاء عنصر جديد، يجب وضعه داخل حاوية موجودة. \
انقر على زر <i class="fa fa-plus-circle" style="color:green;"></i><span style="color: #1E8CFF;"> إضافة</span> لإضافة عنصر إلى الحاوية المطلوبة.</li> \
<li>إذا كان يجب مشاركة عنصر مع الآخرين، فيجب إنشاؤه كعنصر قابل للمشاركة داخل حاوية قابلة للمشاركة.</li> \
<li>يمكن وضع عنصر خاص داخل حاوية خاصة أو قابلة للمشاركة. لا يمكن تغيير العنصر الذي تم إنشاؤه كخاص إلى قابل للمشاركة.</li>\
</ul>

listItemsHelp=<ul style="padding-right:2px">\
<li>لرؤية محتويات عنصر، انقر على اسمه. لفرز قائمة العناصر، انقر على <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;فرز</span>. \
استخدم <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> تحرير</span> لتعديل اسم/حقول العنصر. </li> \
<li>لمشاركة عنصر مع الآخرين، انقر على <i class="fa fa-share-alt-square" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">مشاركة</span>. \
بمجرد مشاركة العنصر، ستظهر أيقونة <i class="fa fa-share-square" style="color:#1E8CFF;"></i> قبل اسمه. \
يمكن إلغاء مشاركة العنصر المشترك بالنقر على <i class="fa fa-ban" style="color:#F65D3C;"></i><span style="color: #F65D3C;"> إلغاء</span>.</li>\
<li>لسرد المستخدمين/المجموعات الذين تمت مشاركة العنصر معهم، انقر على  <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">قائمة</span>. \
إذا تم تعيين تاريخ انتهاء صلاحية للعنصر، ستظهر إحدى الأيقونات \
<i class="fa fa-clock-o" style="color:green"></i>، \
<i class="fa fa-clock-o" style="color:red"></i> \
أيضًا قبل اسمه. </li>\
<li>تشير أيقونة <i class="fa fa-clock-o" style="color:green"></i> \
إلى أن العنصر سينتهي صلاحيته في بعض الأيام المستقبلية. لرؤية تاريخ انتهاء الصلاحية، انقر على اسم العنصر.</li> \
<li>تشير أيقونة <i class="fa fa-clock-o" style="color:red"></i> إلى أن مشاركة العنصر قد انتهت صلاحيتها. \
لن يكون العنصر منتهي الصلاحية قابلاً للعرض من قبل المستخدمين/المجموعات الذين تمت مشاركة العنصر معهم. </li>\
<li>لحذف عنصر (عناصر)، حدد العنصر (العناصر) بالنقر على مربعات الاختيار وانقر على <i class="fa fa-times-circle" style="color:red"></i>\
<span style="border-radius:3px;">&nbsp;<b style="color:#ff0000;">حذف</b> </span>. \
عند حذف عنصر، سيتم حذف جميع النسخ بما في ذلك تلك المشتركة مع الآخرين.</li> \
</ul>

listItemsAddHelp=<ul style="padding-right:2px"> \
<li>لرؤية محتويات عنصر، انقر على اسمه. يمكن فرز العناصر بترتيبات مختلفة باستخدام أيقونة <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;فرز</span> أعلى شريط القائمة.</li> \
<li>لإضافة عنصر إلى الحاوية، انقر على أيقونة <i class="fa fa-plus-circle" style="color:green"></i><span style="font-weight:bold; color: green;"> إضافة</span>.</li> \
</ul>

editItemHelp =<ul style="padding-right:2px"><li>تشير أيقونة القفل المفتوح الأحمر <i class="fa fa-unlock" style="color:red"></i> إلى أن \
البيانات محفوظة بدون تشفير ويمكن البحث فيها. تشير أيقونة القفل الخضراء <i class="fa fa-lock" style="color:green"></i> إلى أن البيانات محفوظة بتشفير.</li> \
<li>يمكن أن يكون العنصر قابلاً للمشاركة أو خاصًا. يمكن مشاركة العنصر القابل للمشاركة فقط مع مستخدمين أو مجموعات أخرى. \
<b>سيظل العنصر الخاص دائمًا خاصًا ولا يمكن تغييره لاحقًا.</b></li>  \
<li>إذا كان العنصر قابلاً للمشاركة، يمكن تحديد تاريخ انتهاء صلاحية للمشاركة. \
سيختفي العنصر من قائمة المستلم بعد التاريخ المحدد. احذف التاريخ لإنهاء صلاحية \
العنصر على الفور. \
لاحظ أن تاريخ انتهاء الصلاحية سيكون له تأثير فقط إذا تمت مشاركة العنصر مع شخص ما.</li></ul>

itemsSharedWithMeHelp=<ul style="padding-left:2px"> \
<li>لرؤية محتويات العنصر، انقر على اسم العنصر. إذا منحك مالك العنصر إذن التحديث، يمكنك تعديله بالنقر على <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> تعديل</span>.</li> \
<li>للتخلي عن العنصر (العناصر)، حدد العنصر (العناصر) بالنقر على مربعات الاختيار أولاً. ثم انقر على <i class="fa fa-chevron-circle-left" style="color:#F65D3C"></i><span style="color: #F65D3C;"> تخلي</span>. \
سيُطلب منك تأكيد التخلي. </li>\
<li>لن تتم مشاركة العناصر المتخلى عنها معك بعد الآن ولن تتمكن من الوصول إليها. </li>  \
</ul>


shareWithUsersHelp=<ul style="padding-left:2px"> \
<li>لمشاركة العنصر/الملاحظة، حدد المستخدم (المستخدمين) المعنيين بالنقر على مربعات الاختيار. ثم انقر على <i class="fa fa-share-alt-square" style="color:green"></i>&nbsp;<b style="color:green;">مشاركة</b>. </li>  \
<li>يمكن البحث عن مستخدم بناءً على الاسم الكامل. أدخل سلسلة فرعية/جزء من الاسم الكامل في مربع البحث وانقر على <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. على سبيل المثال، إذا كان الاسم الكامل للمستخدم هو أكوا مارين، \
فإن إدخال "كوا" في شريط البحث سيعرض معلومات المستخدم. يمكن تحديد المستخدم بالنقر على مربع الاختيار ثم مشاركة الملاحظة/العنصر باستخدام <i class="fa fa-share-alt-square" style="color:green"></i>&nbsp;<b style="color:green;">مشاركة</b>.</li> \
<li>إذا كان الترخيص لا يدعم إرسال إشعار بالبريد الإلكتروني، سيتم تعطيل مفتاح التبديل.</li>
</ul>

shareWithGroupsHelp=<ul style="padding-left:2px"> \
<li>لمشاركة العنصر/الملاحظة، حدد المجموعة (المجموعات) المعنية بالنقر على مربعات الاختيار. ثم انقر على زر <i class="fa fa-share-alt-square" style="color:green"></i>&nbsp;<b style="color:green;">مشاركة</b>. </li>  \
<li>يمكن البحث عن مجموعة بناءً على اسم المجموعة. أدخل سلسلة فرعية/جزء من اسم المجموعة في مربع البحث وانقر على <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. على سبيل المثال، إذا كان اسم المجموعة هو ''أصدقاء مشاركة الركوب''، \
فإن إدخال ''مشاركة'' في شريط البحث سيعرض معلومات المجموعة. يمكن تحديد المجموعة بالنقر على مربع الاختيار ثم مشاركة الملاحظة/العنصر باستخدام زر <i class="fa fa-share-alt-square" style="color:green"></i>&nbsp;<b style="color:green;">مشاركة</b>. </li> \
</ul>

pickItemTypeHelp=<ul style="padding-left:2px"> \
<li>يمكن إنشاء عنصر كملاحظة أو كنسخة من قالب شخصي/عالمي. </li> \
<li>من الممكن أيضًا إنشاء عنصر كأزواج مفتاح/قيمة بتنسيق حر باستخدام اختيار مخصص. </li>  \
</ul>

grantPermissionsToUsersHelp=<ul style="padding-left:2px"> \
<li>هناك إذنان يمكن منحهما لمستخدم آخر. أحدهما ''تحديث'' والآخر ''تملك''. </li> \
<li>إذن التحديث سيسمح للمستخدم بتعديل العنصر أو الملاحظة. إذن التملك سينقل الملكية إلى المستخدم الآخر. </li> \
<li>لمنح إذن، حدد مربع الإذن المناسب وحدد المستخدم (المستخدمين) المعنيين بالنقر على مربعات الاختيار. ثم انقر على زر <i class="fa fa-check-circle" style="color:green"></i>&nbsp;<b style="color:green;">منح</b>. </li> \
</ul>

grantPermissionOnContainerHelp = <ul style="padding-left:2px"> \
<li>إذا تم منح إذن ''إضافة/تعديل عنصر'' للمستخدمين، سيتمكن المستخدمون من إضافة وتعديل العناصر في الحاوية.</li> \
<li>إذا تم منح إذن ''تملك الحاوية'' للمستخدمين، سيتمكن واحد فقط من المستخدمين من أخذ التحكم في ملكية الحاوية. يجب على المستخدم <b>أخذ التحكم في الملكية</b> من \
شاشة <b>الحاويات -> الحاويات المشتركة معي</b>. أول مستخدم يأخذ الملكية سيصبح مالك الحاوية. يمكن للمالك الأصلي والمالك الجديد أخذ التحكم في الملكية ذهابًا وإيابًا</li> \
</ul>

pickRevokeSharingHelp=<ul style="padding-left:2px"> \
