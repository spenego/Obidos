twilioHelp=<ul style="padding-right:2px"> \
<li> حاليًا ندعم واجهة برمجة تطبيقات Twilio <a href="https://www.twilio.com/">www.twilio.com</a> لإرسال الرسائل القصيرة</li> \
<li>يرجى التسجيل مع مزود خدمة الرسائل القصيرة Twilio <a href="https://www.twilio.com/">www.twilio.com</a> \
للحصول على <b>معرف الأمان للحساب \
(SID)</b>، و<b>رمز المصادقة</b> و<b>رقم الهاتف</b>. ملاحظة: لإرسال الرسائل القصيرة في الولايات المتحدة، \
يجب تسجيل رقم الهاتف المقدم من مزود خدمة الرسائل القصيرة للامتثال لـ A2P 10DLC مع مزود خدمة الرسائل القصيرة، \
وإلا سيتم رفض الرسائل القصيرة من قبل شركات الاتصالات الأمريكية. \
ستنشأ رسالة SMS \
من رقم الهاتف المقدم من Twilio. يتم تخزين هذه المعلومات بشكل آمن \
في قاعدة بيانات Obidos</li> \
<li>قم بتكوين رسائل Twilio القصيرة إذا كنت ترغب في أن يتلقى المستخدمون إشعارًا عبر الرسائل القصيرة عند \
مشاركة عنصر أو ملاحظة أو حاوية معهم</li> \
<li>سيتمكن المستخدمون من تكوين قبول رسائل الإشعار القصيرة أم لا من \
صفحة ملفهم الشخصي</li> \
<li>سيتم إرسال الرسالة القصيرة إلى <b>رقم الهاتف المحمول المكون</b> للمستخدم. يجب \
أن يكون رقم الهاتف قادرًا على استقبال الرسائل القصيرة</li> \
</ul>
