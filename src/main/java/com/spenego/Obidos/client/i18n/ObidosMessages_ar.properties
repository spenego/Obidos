بمجرد الإلغاء، لن يتمكن المستخدمون من الوصول إلى الملاحظة/العنصر بعد ذلك. </li>  \
<li>يمكن أيضًا تحديد المستخدمين المعنيين عن طريق البحث عنهم بناءً على جزء/سلسلة فرعية من أسمائهم. </li> \
</ul>

