# AD/LDAP Setting
ldapSettingHelp = <ul style="padding-left:2px"> \
<li>يجب أن يحدد <span style="font-weight:bold;">اسم التكوين </span> نطاق AD أو خادم LDAP.</li> \
<li>مثال على <span style="font-weight:bold;">عنوان URI لـ LDAP</span>: ldap://&lt;server&gt;:389 أو ldaps://192.168.1.30:636</li> \
<li>بالنسبة لـ ldaps، يجب استيراد شهادة خادم AD/LDAP إلى Obidos عبر الإعدادات -> تثبيت شهادة AD/LDAP.</li> \
<li>مثال على <span style="font-weight:bold;"> DN الأساسي</span>: dc=example,dc=com</li> \
<li>إذا كان خادم AD/LDAP يتطلب الربط قبل البحث، حدد DN الربط. مثال: cn=binduser,dc=example,dc=com</li> \
<li><span style="font-weight:bold;">كلمة مرور الربط</span> هي كلمة المرور لـ DN الربط</li> \
<li>بالنسبة لـ AD، يمكن تحديد <span style="font-weight:bold;">DN الربط </span> كـ user@ADdomain.com. في هذه الحالة لا حاجة لكلمة مرور الربط.</li> \
<li><span style="font-weight:bold;">سمة المصادقة </span>هي السمة في AD/LDAP التي تطابق اسم تسجيل الدخول في Obidos. بالنسبة لـ AD، الافتراضي هو samAccountName.</li> \
<li>احفظ التكوين قبل ''اختبار الاتصال/المصادقة''. قد يكون DN الربط وكلمة المرور مطلوبين لاختبار الاتصال.</li> \
<li>لـ ''اختبار المصادقة''، قدم اسم مستخدم وكلمة مرور في AD/LDAP. لا يتعين أن يكون الحساب موجودًا في Obidos.</li> \
</ul>

