auditLogAdminHelp = <ul style="padding-left:2px"> \
<li>يعرض سجل التدقيق نشاط المسؤولين والمستخدمين</li> \
<li>لا يكشف سجل التدقيق أبدًا عن المحتوى المشفر لملاحظات المستخدمين أو العناصر أو \
المستندات</li> \
</ul>

editAdminHelp = <ul style="padding-left:2px"> \
<li>سيفشل تحديث حساب إذا لم تكن لديك القدرات اللازمة. يرجى التحقق من \
قدراتك من قائمة <b>تسجيل الدخول > قدراتي</b> في الجانب \
الأيمن البعيد من شريط التنقل.</li> \
<li>يرجى ملاحظة أن تشغيل جميع القدرات لا يجعل المسؤول <b>مسؤول جذر</b>، يجب \
تعيينه صراحة عن طريق تشغيل مفتاح <b>الترقية إلى مسؤول جذر</b></li> \
<li>يمكن للمسؤول الجذر فقط تعديل معلومات مسؤول جذر آخر</li> \
<li>يمكن تحديث اسم المستخدم وكلمة المرور فقط إذا \
تم تعيين قدرة <b>تغيير بيانات اعتماد المسؤول</b></li> \
<li>يمكن للمسؤول الجذر فقط تغيير قدرات المسؤولين الآخرين</li> \
<li>إذا تم تعطيل <b>الترقية إلى مسؤول جذر</b>، فهذا يعني أن المسؤول هو بالفعل مسؤول جذر</li> \
</ul>

uploadProfilePicHelp = <ul style="padding-left:2px"> \
<li>لتعيين صورة الملف الشخصي، يرجى تحميل صورة أولاً.</li> \
<li>ثم حدد المنطقة من الصورة التي تريد تعيينها كصورة ملفك الشخصي.</li> \
<li>قم بتطبيق أي فلتر على المنطقة المحددة إذا رغبت في ذلك. ثم انقر على زر <b>اقتصاص</b>. سيتم تعيين صورة الملف الشخصي كصورة مصغرة في المستطيل العلوي.</li> \
<li>إذا كنت ترغب في إضافة تعليق توضيحي للصورة بنص، انقر على موقع في الصورة المصغرة \
للصورة، اكتب النص، حدد اللون ثم انقر على زر <b>إضافة تعليق توضيحي</b>.</li> \
<li>إذا كنت راضيًا، انقر على زر <b>حفظ</b>.</li>\
<li>ستظهر صورة الملف الشخصي إذا قمت بزيارة صفحة <b>تعديل الملف الشخصي</b> بالنقر على البريد الإلكتروني في الزاوية العلوية اليمنى من شريط التنقل.</li>\
<li>إذا قمت بمشاركة أي عنصر مع شخص ما، سيتمكن المشارك من عرض صورة الملف الشخصي بالنقر على اسمك الكامل.</li>\
</ul>

createUserHelp = قيد الإنجاز

createAdminHelp = <ul style="padding-left:2px"> \
<li>يمكن أن يحتوي اسم المستخدم على أحرف كبيرة وصغيرة وأرقام و_ و- و.</li> \
<li>سيتمكن كل مسؤول من تنفيذ جميع الإجراءات ضمن قائمة 'الإعدادات'. وبالمثل، سيتمكن كل مسؤول من تغيير معلومات الملف الشخصي لمستخدم أو مسؤول. ومع ذلك، يتطلب تغيير بيانات الاعتماد (اسم المستخدم، كلمة المرور، المصادقة الثنائية) لمستخدم أو مسؤول القدرة على 'تعديل بيانات الاعتماد'.</li> \
<li> <span style="font-weight:bold">المسؤول الجذر</span> هو \
نوع خاص من المسؤولين الذين لديهم قدرات كاملة لإدارة \
حسابات المستخدمين والمسؤولين. يمكن للمسؤول الجذر فقط إدارة جميع القدرات لحساب \
مسؤول جديد أو إنشاء حساب <span style="font-weight:bold">مسؤول جذر</span> آخر. \
مجرد تشغيل جميع القدرات تحت "قدرات المسؤول الجديد" لا يجعل المسؤول \
<span style="font-weight:bold">مسؤول جذر</span>. </li> \
<li>لإنشاء حساب <span style="font-weight:bold">مسؤول جذر</span>، قم بتشغيل \
قيمة <span style="font-weight:bold">إنشاء كمسؤول جذر</span>. </li> \
</ul>

listUsersHelp = <ul style="padding-left:2px"> \
<li>إذا رأيت ✗ على زر <b>حذف نهائي</b> أو <b>قفل</b>، فهذا يعني أنك \
لا تملك القدرات على حذف أو قفل حساب على التوالي. في هذه الحالة لن \
تتمكن من تحديد مسؤول أو مستخدم بالنقر على خانة الاختيار أيضًا.</li> \
<li>لعرض قدراتك انقر على اسم المستخدم الخاص بك في الجانب الأيمن البعيد من \
شريط التنقل ثم انقر على <b>قدراتي</b>. </li></ul>

listLoggedInUsersHelp=<ul style="padding-left:2px">\
<li>قائمة المستخدمين والمسؤولين المسجلين حاليًا</li>\
</ul>

