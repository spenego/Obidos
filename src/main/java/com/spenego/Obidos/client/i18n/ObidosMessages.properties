listOfUsersItemIsSharedWithHelp =<ul style="padding-left:2px"> \
<li>To see if an Item\/Note was shared with a specific user\/group, a search can be done based on the name. \
Enter a substring\/part of the name in the search box and click <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. </li> \
<li>For example, if the user''s full name is Aqua Marine, \
entering qua in the search bar will display the user info if the Item/Note in context was shared with that user. </li> \
</ul>

listOfUsersInGroupHelp =<ul style="padding-left:2px"> \
<li>To see the details of a user, click on the user name under the column <span style="font-weight:bold;">Full Name</span>. \
To search for a particular user, enter a substring\/part of the name in the search box and click <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. \
For example, if the user''s full name is Aqua Marine, entering qua in the search bar will display the user info on search. </li> \
<li>To remove user(s) from the group, select the user(s) and click on <i class="fa fa-minus-circle" style="color:red"></i><span style="border-radius:3px;color:#ff0000;font-weight:bold;">&nbsp;Remove</span>.</li> \
</ul>

notificationMessagesHelp=<ul style="padding-left:2px"> \
<li>The latest messages are displayed on the top. A message could be related to a shared artifact or a revoked/deleted artifact.</li> \
<li>Message related to a revoked/deleted artifact is informational only. They are not clickable links. </li> \
<li>Messages related to sharing are clickable. \
To see the Item/Note that was shared with you, click on the message field. </li>\
<li>To delete messages, select the ones of interest and click on \
<i class="fa fa-times-circle" style="color:red"></i><span style="border-radius:3px;color:#ff0000;font-weight:bold;">&nbsp;Delete</span>. \
To mark messages as read, select the relevant ones and click on <i class="fa fa-check" style="color:#3874de;"></i><span style="font-weight:bold;color:#3874de;">&nbsp;Mark as Read</span>.</li> \
</ul>

actionHistoryHelp=<ul style="padding-left:2px"> \
<li>To see history of your activities, select the artifacts of interest. </li> \
<li>You can set the time period during which the activities occurred. </li> \
<li>To select Date and Time, <b>Click</b> on the Text field to pop the Calendar, Then <b>Click</b> to select day \
and then <b>Click</b> to select time and after that <b>Click</b> to select the time by minute if desired. \
Please Note: <b>the 3 Clicks (Day, time, time fraction) must be performed to complete the date and time selection</b>.</li> \
<li>To pop the date dialog again, <b>click outside first to hide</b> and then click on the text field again to show it.</li>
</ul>

tombstonedHelp = <ul style="padding-left:2px">\
<li>The tombstoned users or admins cannot login to the system anymore, nor can those accounts be restored. \
They are kept for reporting and auditing purposes only.</li> \
<li>When users are tombstoned, any artifact shared with others will continue to be shared. Containers, Items and Notes that are not shared with anyone are deleted. </li>\
<li>The username of a tombstoned user/admin can be re-used. However, the email address cannot be re-used.</li> \
</ul>

lockedHelp = <ul style="padding-left:2px">\
<li>A locked user/admin will not be able to login to the system. All private information of a locked user will remain encrypted and not accessible by anyone else.</li> \
<li>The username or email address of a locked user/admin cannot be assigned to a new user. Once unlocked, the user/admin will get access back to the system. </li>\
<li>Locked users/admins can be unlocked by an admin who has the capability to do so. To unlock a user/admin select the account and click on the corresponding <span style="background-color:#00b300;color:#ffffff;font-weight:bold;border-radius:3px;">&nbsp;Unlock&nbsp;</span> button.</li>\
</ul>

pickNotificationTemplateHelp = <ul style="padding-left:2px"> \
<li>When email notifications are sent, the texts for Account Created, Password Reset, \
Passphrase Reset, Item Shared, Container Shared etc. can be changed.</li> \
</ul>

