<br/> \
<li>Once the second month of grace period expires, no item can be viewed, created, modified or shared.</li> \
</ul> \
<font style="font-weight:bold;">Please notify your IT department to update the license as soon as possible.</font>

licenseGracePeriodSecondMonthAfterExpiry = <p style="text-align:center;font-weight:bold;color:red;font-size:1.2em">Your Obidos license has expired.</p> \
This is the second month of grace period for regular users. Administrators do not have any grace period.<br/><br/> \
