# AD/LDAP Setting
ldapSettingHelp = <ul style="padding-left:2px"> \
<li><span style="font-weight:bold;">Configuration Name </span>should identify the AD Domain or LDAP server.</li> \
<li>Example of <span style="font-weight:bold;">LDAP URI</span>: ldap://&lt;server&gt;:389 or ldaps://192.168.1.30:636</li> \
<li>If StartTLS is enabled, the LDAP URI <b>must be</b> ldap://&lt;server&gt:389 (standard port), as secure connection will be negotiated</li> \
<li>For ldaps and StartTLS, AD/LDAP server certificate must be imported into Obidos via Settings -> Install AD/LDAP Cert.</li> \
<li>Example of <span style="font-weight:bold;"> Base DN</span>: dc=example,dc=com</li> \
<li>If AD/LDAP server requires binding before search, specify a Bind DN. Example: cn=binduser,dc=example,dc=com</li> \
<li><span style="font-weight:bold;">Bind Password</span> is the password for the Bind DN</li> \
<li>For AD, <span style="font-weight:bold;">Bind DN </span>can be specified as user@ADdomain.com. In this case there is no need for Bind Password.</li> \
<li><span style="font-weight:bold;">Auth Attribute </span>is the attribute in AD/LDAP that matches login name in Obidos. For AD the default is samAccountName.</li> \
<li>Save the Configuration before ''Test Connection/Authentication''. BIND DN and Password may be required for Connection Test.</li> \
<li>To ''Test Authentication'', provide a username and password in AD/LDAP. The account does not have to exist in Obidos.</li> \
</ul>

