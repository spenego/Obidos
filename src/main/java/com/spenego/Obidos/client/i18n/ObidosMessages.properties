here to obtain the Two Factor Code like Google Authenticator, Microsoft Authenticator, Authy etc. QR Code image can \
be used to import the 2FA secret to authenticator app in your phone. Issuer and Account is not really needed \
to generate 2FA Code but if you would be importing the secret to some Authenticator app, Issuer and Account is \
necessary for identifying the account. <font color="#ff0000"><b>Please make sure \
to protect your 2FA secret. Never keep it on disk or on any device without proper encryption.</b> \
Be careful to display the QR Code Image as it contains the secret and it is very easy to take a picture of it \
if if you leave your computer unattended. Also do not store QR Code image file on disk without proper encryption. \
After importing the secret to Obidos, you should remove the image from your system. Note: anything stored in Obidos is \
properly encrypted.
</font>

