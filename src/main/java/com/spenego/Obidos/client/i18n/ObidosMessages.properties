<li> Currently we support Twilio <a href="https://www.twilio.com/">www.twilio.com</a> API to send SMS</li> \
<li>Please register with Twilio <a href="https://www.twilio.com/">www.twilio.com</a> SMS provider \
to obtain <b>Account Security \
Identifier (SID)</b>,  <b>Auth Token</b> and <b>Phone number</b>. Note: snding SMS in the US, \
the phone number provided by the SMS provider must be registered for A2P 10DLC compliance with the SMS provider, \
otherwise SMS will be rejected by US carriers. \
The SMS message will originate \
from the Twilio provided phone number. These information are stored securely \
in Obidos database</li> \
