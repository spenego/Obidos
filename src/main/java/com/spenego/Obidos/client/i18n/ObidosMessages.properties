whatIsAContainerHelp = A Container contains <b>Items</b>. Items can be information about \
login information about a website, computer or information about your credit cards or just simple notes. \
Containers can be <b>Shareable</b> or <b>Private</b>. A Shareable Container can be shared with users or groups. \
Items inside a Container can be Shareable or Private as well. A Shareable Item can be shared with users or groups. \
<b>Note</b>: The designation of a Container can never be changed. A Private Container will always remain private and vice versa.
