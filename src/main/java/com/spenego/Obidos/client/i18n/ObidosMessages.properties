forgotPassphraseMessage = <b>WARNING: If you forgot your passphrase, \
none of your private information can be decrypted anymore! There is no \
back door or work-around. You must start over again after re-creating the encryption keys. \
For shared items, please contact the owner to re-share them. If you are in a group, please \
contact the group owner to remove and add you to the group again. The reason is that, all items \
are encrypted with your public key and decrypted with your private key and only you can decrypt them. \
<p style="color:red;"> \
All your existing Items and Notes will be deleted as there is no way to \
decrypt them anymore. \
<p> \
It is probably a good idea to take some time before you reset your passphrase,  \
because you might remember it a little later. \
</b>
