createPersonalTemplateHelp= <ul style="padding-left:2px"><li>Templates capture the structure of repeatedly used Items. \
Common examples are <b>Credit Cards</b>, <b>Web Site Login Credentials</b> etc.</li>  \
<li>Templates have the fields defined in them. For example, a Credit Card Template can have <b>Credit Card Number</b>, <b>Name on Credit Card</b>, <b>Expiration Date</b> etc.</li> \
<li>Template Name, fields and display order can be changed any time. Such changes will affect only new Items. Template name can be used in search.</li> \
<li>Personal Templates can only be used by the owner and not visible to other users.</li> \
<li>To open a new field name and display order row, <b>press ENTER</b> while in <b>Field Name</b> TextBox or click on the <i class="fa fa-plus-square" style="color:#17a2b8"></i> button</li> \
</ul>

createGlobalTemplateHelp= <ul style="padding-left:2px"><li>A Template captures the common structure of Items. \
For example, <b>Credit Cards</b>, <b>Web Site Login Credentials</b> etc.</li>  \
<li>Templates have only the fields defined in them. For example, a Credit Card Template can have <b>Credit Card Number</b>, <b>Name on Credit Card</b>, <b>Expiration Date</b> etc. as fields.</li> \
<li>Template Name, fields and display order can be changed any time. Only Template name is unencrypted and can be used in search.</li> \
<li>Global Templates are available to all users. Users can copy a Global Template to a Local Template and modify to suite their needs.</li> \
<li>To open a new field name and display order row, <b>press ENTER</b> while in <b>Field Name</b> TextBox or click on the <i class="fa fa-plus-square" style="color:#17a2b8"></i> button</li> \
</ul>


