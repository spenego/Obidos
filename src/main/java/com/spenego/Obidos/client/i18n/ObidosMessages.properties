licenseWillExpireInOneMonth = <p style="font-weight:bold;text-align:center;background-color:#ffcc00">Your Obidos license will expire soon.</p> \
Once the license expires: \
<ul style="padding-left:2px"> \
<li>Administrators do not have any grace period. They will not be able to create or modify users and admins.</li> \
<li>For regular users, there will be two months of grace period after license expiration.</li> \
<li>During the first month of grace period, the software will work normally for users.</li> \
<li>In the second month of grace period, users will  be able to view \
the items but will not be able to create any new item or share items.</li>\
<li> Once the two months of grace period expires, no item can be viewed, created, modified, or shared.</li> \
<li> The license details can be viewed from <i>Your Name -&gt; View License</i> menu</li>
</ul>\
<font style="font-weight:bold">Please notify your IT department to update the license as soon as possible.</font>

licenseGracePeriodFirstMonthAfterExpiry = <p style="text-align:center;font-weight:bold;color:red;font-size:1.2em;">Your Obidos license has expired.</p> \
This is the first month of grace period for regular users. Administrators do not have any grace period. <br/> <br/>\
<ul style="padding-left:2px"> \
<li>Administrators will not be able to create or modify users and admins.</li> \
<br/> \
<li>For regular users, during the current month of grace period, the software will work normally.</li> \
<br/> \
