createAndAddItemToAContainer = Create and Add Item to a Container
addItemToPublicContainerHelp=<ul style="padding-left:2px"><li>Fields marked with Unlock icon <i class="fa fa-unlock" style="color:red"></i> are stored in plain text. \
Fields marked with Lock icon <i class="fa fa-lock" style="color:green"></i> are kept encrypted and cannot be used in search</li> \
<li>If the Container is of type Shareable, then an Item stored in it can be Shareable or Private. </li> \
<li><font color="red">This Container is Shareable. Carefully decide if the Item can be shared or not.</font></li> \
<li>If an Item is Shareable, an expiration day for sharing can be specified. That means, if an expiration day is set, \
the Item will disappear from recipient''s list after the specified day. \
If no <span style="font-weight: bold;">Share expiration</span> is set, then the Item will have no expiration. \
The expiration days will have effect only if the Item is shared with someone.</li></ul>

addItemToPrivateContainerHelp=<ul style="padding-left:2px"><li>Fields with Unlock icon <i class="fa fa-unlock" style="color:red"></i> are stored in plain text. \
Fields with Lock icon <i class="fa fa-lock" style="color:green"></i> are kept encrypted and cannot be used in search.</li> \
<li><font color="red">Since this Container is Private, only Private Items can be created in it.</font></li></ul>

listContainersHelp=<ul style="padding-left:2px"> \
<li>To see the list of Items in a Container, click on the Container name. To change name of a Container, use <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> Edit</span>. A Container can be shared with others using <i class="fa fa-share-alt-square" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">Share</span> action.</li>\
<li> If a Container was shared, the <i class="fa fa-share-square" style="color:#1E8CFF;"></i> icon will be displayed before the name of the Container. \
A Container that was already shared can be revoked by using <i class="fa fa-ban" style="color:#F65D3C"></i><span style="color: #F65D3C;"> Revoke</span> option.</li>\
<li>To see the list of users/groups to whom the Container was shared, click on <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">List</span> under the <span style="font-weight: bold">Shared With</span> column.</li>\
<li>To delete Container(s), first select the Container(s) by clicking on the CheckBoxes. \
Then click on <i class="fa fa-times-circle" style="color:red"></i><span style="border-radius:3px;">&nbsp;<b style="color:#ff0000;">Delete</b> </span> \
button above the listing. You will be prompted to confirm deletion. \
When a Container is deleted, all copies of the Container including ones shared with others (and the Items inside) will also be deleted.</li> \
</ul>


createContainerHelp=<ul style="padding-left:2px"><li>Containers hold Items. Ideally, a Container name should identify the type of Items it will hold. For example Banks, Credit Cards, Systems etc. Container name can be changed later.</li>\
<li>Containers can be of type Shareable or Private. Only Shareable Containers can be shared with other users/groups.</li>\
<li><span style="font-weight: bold;color:#FF0000;">A Container type can never be changed</span>. So a Private Container will always remain Private and a Shareable Container will always remain as Shareable.</li> \
<li>The Items inside Shareable Containers can be Shareable or Private. However, the Items inside a Private Container \
are always Private.</li> \
<li>If a Shareable Container is shared, only the Shareable Items inside the Container will be shared.</li></ul>

# ================  Admin Panel Help pages

adminMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">Admins</font></b></div></p> \
<p><b>Create new Admin:</b> Root admins and admins with admin creation privileges can create new admins. This menu items will be inactive if the admin does not have the capability to do so.</p> \
<p><b>Manage Admin:</b> Lists admin profiles, where information can be edited and admins can be locked or tombstoned. This menu items will be inactive if the admin does not have the capability to do so.</p> \
<p><b>Locked Admins:</b> Lists locked admins, and gives the option to unlock them. This menu items will be inactive if the admin does not have the capability to do so.</p> \
<p><b>Tombstoned Admins:</b> Lists tombstoned admins, and gives the option to restore them. This menu items will be inactive if the admin does not have the capability to do so.</p>\
</span>

usersMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">Users</font></b></div></p> \
<p>The <b>Create new user</b> menu is for creating new user accounts by root admin or by admins with capability to create user accounts.</p> \
<p><b>Manage Users</b> menu is used to provide a list of active user accounts. The profile or credentials of a user account can be edited from this list.</p>\
<p><b>Locked Users</b> menu is used to provide a list of user accounts that are locked. \
Using this list, a locked user account can be unlocked. </p>\
<p><b>Tombstoned Users</b> menu provides the list of tombstoned user accounts, the accounts those are marked as deleted. These accounts can be restored but cannot be permanently deleted at this time.</p>\
</span>

settingsMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">Settings</font></b></div></p> \
<p>The <b>Create AD/LDAP</b> menu is used to configure specifics of any enterprise Active Directory or LDAP that is a source for user credentials. </p>\
<p>The <b>Create SMTP settings</b> allows to configure the corporate Email gateway so that Obidos can send email notifications. </p>\
<p><b>System Settings</b> menu can be used to set http/s settings, 2FA issuer, Date format, local password policy and passphrase policy. </p>\
<p>The web front-end to Obidos requires an SSL certificate. This can be installed useing the <b>Install Web SSL Sertificate</b> menu </p>\
<p>If the Active Directory or LDAP is configured to use secure connection, certificate used for this secure communication \
needs to be installed on the Obidos side. The menu <b>Install AD/LDAP server Certifcate</b> menu facilitates this.</p>\
<p>The software license for Obidos can be installed using the <b>Install Obidos License</b> menu. Uninterrupted service can be \
maintained by installing upgrade license before the current license expires. </p>\
</span>

auditMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">Audit</font></b></div></p> \
<p>The audit report shows a static report of the system in general.</p> \
<p>The audit logs allows to see the activities of specific users or occurrences of specific events. \
To narrow the search, the activity of interest can be specified. Otherwise all activities will be displayed by default. \
The period of interest can be chosen from the calendar. </p>\
</span>

# Main Notes Menu Help

notesMenuHelpTitle=Notes
notesMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">Notes</font></b></div></p> \
<p>A Note is the analog of a postit note. A Note has a name and content. Notes can be standalone or placed inside Containers. In this section, we explain the menus available for standalone Notes.</p> \
<p>Each screen has screen-speific help that can be accessed by clicking on <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-info-circle" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;Help&nbsp</span></span> button at the top right of the panel. \
Once you navigate to a down level screen, to return to the previous screen, use the <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-arrow-circle-left" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;Back&nbsp</span></span> button at the top left of the panel. </p>\
<p>Navigation through the listing menus are similar and described here. \
By default, the Notes will be displayed in the order in which they were created with the latest one at the top. \
To sort the list of Notes in another order, click on <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;Sort</span> icon above the list bar. \
At the bottom of the screen it will be shown as to how many Notes exist. \
For example if there are 23 Notes and 14 are listed in the current screen, at the bottom of the screen you will see \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> 1-14 of 23 <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
In order to move forward in the list one at a time, click on <img src="/images/simplePagerNextPage.png">. \
To move forward a complete page, click on <img src="/images/simplePagerLastPage.png">. \
Similary, to go back in the list one at a time, click on <img src="/images/simplePagerPreviousPage.png"> \
and to go back one complete page, click on <img src="/images/simplePagerFirstPage.png">. \
To see the contents of a Note, click on its name. </p>\
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">Create New Note</font></b></span></p> \
<p><b><font color="blue">Create New Note</font></b> menu is used to create a Note. A name can be assigned to the Note. This name can be used in search to find a specific Note from the collection of all Notes owned by the user. The content of a Note is the text associated with the Note. The content is stored encrypted.</p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">My Notes</font></b></span></p> \
<p><b><font color="blue">My Notes</font></b> menu displays the list of all standalone Notes owned by the user. \
If a Note was shared with other users/groups, the icon <i class="fa fa-share-square" style="color:#1E8CFF;"></i> will appear before the name of the Note. \
To see the list of users/groups to whom the Note was shared, click on <i class="fa fa-users" style="color:#1E8CFF;"></i> <span style="color: #1E8CFF;">List</span>. </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">My Notes Shared With Others</font></b></span></p> \
<p><b><font color="blue">My Notes Shared With Others</font></b> menu lists all Notes that were shared with other users/groups. The operations on each Note is exactly the same as the operations under "My Notes" menu. </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">Notes Shared With Me</font></b></span></p> \
<p><b><font color="blue">Notes Shared With Me</font></b> menu lists all the Notes others have shared with the user. \
The <span style="font-weight: bold">Shared By</span> column shows who shared the Note with you. \
If the owner of a Note has given edit permissions on the Note, you can use <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> Edit</span> to change contents of the Note. </p>\
</span>

historyMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">History</font></b></div></p> \
<p>The history of activities during a specific time period can be selectively displayed.</p> \
<p>The activity of interest can be specified. Otherwise all activities will be displayed by default. \
The period of interest can be chosen from the calendar. </p>\
</span>

createNoteHelp=<ul style="padding-left: 2px"><li><b>Note Name</b> is not encrypted and can be used in search. The red open lock icon <i class="fa fa-unlock" style="color:red"></i> indicates that \
the Note name is stored unencrypted.</li>\
<li>Note content is kept encrypted as indicated by the green <i class="fa fa-lock" style="color:green"></i> icon. Hence it cannot be searched. Any XSS in Note content will be cleansed before saving.</li> \
<li>Only a Shareable Note can be shared with other users/groups. Private Note will always remain Private.</li>\
<li>For a Shareable Note, an expiration date can be set. When the Note is shared with someone, the Note will expire on that date. The expiration date can be changed any time.</li>\
</ul>

listNotesHelp=<ul style="padding-left:2px">\
<li>To see contents of a Note, click on its name. To sort the list of Notes, click on <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;Sort</span>. \
Use <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> Edit</span> to change name/contents of a Note. </li> \
<li>To share a Note with others, click on <i class="fa fa-share-alt-square" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">Share</span>. \
Once a Note is shared, the <i class="fa fa-share-square" style="color:#1E8CFF;"></i> icon will appear before its name. \
A shared Note can be revoked by clicking <i class="fa fa-ban" style="color:#F65D3C;"></i><span style="color: #F65D3C;"> Revoke</span>.</li>\
<li>To list users/groups to whom a Note was shared, click on  <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">List</span>. \
If an expiration day was set on the Note, one of the icons \
<i class="fa fa-clock-o" style="color:green"></i>, \
<i class="fa fa-clock-o" style="color:red"></i> \
will also be displayed before its name. </li>\
<li>The <i class="fa fa-clock-o" style="color:green"></i> icon indicates \
that the Note will expire some days in the future. To see the expiration date, click on the name of the Note.</li> \
<li>The <i class="fa fa-clock-o" style="color:red"></i> icon indicates that the Note sharing has expired. \
The expired Note will not be viewable by the users/groups to whom the Note was shared. </li>\
<li>To delete Note(s), select the Note(s) by clicking on the CheckBoxes and click <i class="fa fa-times-circle" style="color:red"></i>\
<span style="border-radius:3px;">&nbsp;<b style="color:#ff0000;">Delete</b> </span>. \
When a Note is deleted, all copies including those shared with others will be deleted.</li> \
</ul>

notesSharedWithMeHelp=<ul style="padding-left:2px"> \
<li>The <span style="font-weight: bold">Shared By</span> column shows who shared the Note with you. \
To see the contents of a Note, click on its name. \
To sort the list of Notes, click on <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;Sort</span>. </li>\
<li>If you were granted update permission on a Note, you can edit it by clicking on <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> Edit</span>. </li> \
<li>To relinquish Notes select the Notes by clicking on the CheckBoxes first. Then click on <i class="fa fa-chevron-circle-left" style="color:#F65D3C"></i><span style="color: #F65D3C;"> Relinquish</span>. \
You will be prompted to confirm relinquishing. \
Once relinquished, the selected Notes will \
no longer be shared with you and you will not be able to access them. </li>  \
</ul>

viewNoteHelp = <ul style="padding-left:2px">\
<li>If <b>Take Ownership</b> button is being displayed, that \
means that the owner of the Note has granted you the permission to take ownership. \
Once clicked on the <b>Take Ownership</b> button, you will be given the option to select a \
Container for the Note.</li> \
</ul>

# Main Help for Items

itemsMenuHelpTitle=Items
itemsMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">Items</font></b></div></p> \
<p>An Item is an instance of a Template or an ad hoc set of &lt;field,value&gt; pairs or a Note. Every Item is placed inside a Container.</p>\
<p>Each screen has screen-speific help that can be accessed by clicking on <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-info-circle" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;Help&nbsp</span></span> icon at the top right of the panel. \
Once you navigate to a down level screen, to return to the previous screen, use the <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-arrow-circle-left" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;Back&nbsp</span></span> button at the top left of the panel. </p>\
<p>Navigation through the listing menus are similar and described here. \
By default, Items will be displayed in the order in which they were created with the latest one at the top. \
To sort the list of Items in another order, click on <i class="fa fa-sort" style="color:blue;"></i><span style="color: blue;">Sort</span> icon above the list bar. \
At the bottom of the screen it will be shown as to how many Items exist. \
For example if there are 43 Items and 12 are listed in the current screen, at the bottom of the screen you will see \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> 1-12 of 43 <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
In order to move forward in the list one at a time, click on <img src="/images/simplePagerNextPage.png">. \
To move forward a complete page, click on <img src="/images/simplePagerLastPage.png">. \
Similary, to go back in the list one at a time, click on <img src="/images/simplePagerPreviousPage.png"> \
and to go back one complete page, click on <img src="/images/simplePagerFirstPage.png">. \
To view the Item, click on its name. </p>\
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">Create New Item</font></b></span></p> \
<p><b><font color="blue">Create New Item</font></b> menu is used to create an Item. A name can be assigned to the Item. \
This name can be used in search to find a specific Item from the collection of all Items owned by the user. </p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">My Items</font></b></span></p> \
<p><b><font color="blue"> My Items</font></b> menu is used to get a listing of all Items from all Containers owned by the user. \
If an Item was shared with other users/groups, the icon <i class="fa fa-share-square" style="color:green"></i> will appear before the name of the Item. \
To see the list of users/groups to whom the Item was shared, click on <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">List</span>. </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">My Items shared with others</font></b></span></p> \
<p><b><font color="blue">My Items shared with others</font></b> menu lists all Items that were shared with other users/groups. The operations on each Item is exactly the same as the operations under "My Items" menu. </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">Items shared with me</font></b></span></p> \
<p><b><font color="blue">Items Shared with me</font></b> menu lists all Items that others shared with the user.</p> \
</span>

createNewItemHelp=<ul style="padding-left:2px">\
<li>When a new Item is created, it has to be placed inside an existing Container. \
Click on <i class="fa fa-plus-circle" style="color:green;"></i><span style="color: #1E8CFF;"> Add</span> button to add an Item to the Container of interest.</li> \
<li>If an Item is to be shared with others, it must be created as a Shareable Item inside a Shareable Container.</li> \
<li>A Private Item can be placed inside a Private or Shareable Container. An Item created as Private cannot be changed to Shareable.</li>\
</ul>

listItemsHelp=<ul style="padding-left:2px">\
<li>To see contents of an Item, click on its name. To sort the list of Items, click on <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;Sort</span>. \
Use <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> Edit</span> to edit name/fields of an Item. </li> \
<li>To share an Item with others, click on <i class="fa fa-share-alt-square" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">Share</span>. \
Once an Item is shared, the <i class="fa fa-share-square" style="color:#1E8CFF;"></i> icon will appear before its name. \
A shared Item can be revoked by clicking <i class="fa fa-ban" style="color:#F65D3C;"></i><span style="color: #F65D3C;"> Revoke</span>.</li>\
<li>To list users/groups to whom an Item was shared, click on  <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">List</span>. \
If an expiration day was set on the Item, one of the icons \
<i class="fa fa-clock-o" style="color:green"></i>, \
<i class="fa fa-clock-o" style="color:red"></i> \
will also be displayed before its name. </li>\
<li>The <i class="fa fa-clock-o" style="color:green"></i> icon indicates \
that the Item will expire some days in the future. To see the expiration date, click on the name of the Item.</li> \
<li>The <i class="fa fa-clock-o" style="color:red"></i> icon indicates that the Item sharing has expired. \
The expired Item will not be viewable by the users/groups to whom the Item was shared. </li>\
<li>To delete Item(s), select the Item(s) by clicking on the CheckBoxes and click <i class="fa fa-times-circle" style="color:red"></i>\
<span style="border-radius:3px;">&nbsp;<b style="color:#ff0000;">Delete</b> </span>. \
When an Item is deleted, all copies including those shared with others will be deleted.</li> \
</ul>

listItemsAddHelp=<ul style="padding-left:2px"> \
<li>To see the contents of an Item, click on its name. The Items can be sorted in different orders using <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;Sort</span> icon above the list bar.</li> \
<li>To add an Item to the Container, click on <i class="fa fa-plus-circle" style="color:green"></i><span style="font-weight:bold; color: green;"> Add</span> icon.</li> \
</ul>

editItemHelp =<ul style="padding-left:2px"><li>The red open lock icon <i class="fa fa-unlock" style="color:red"></i> indicates that \
the data is kept un-encrypted and can be searched. The green lock icon <i class="fa fa-lock" style="color:green"></i> indicates that the data is kept encrypted.</li> \
<li>Item can be Shareable or Private. Only Shareable Item can be shared with other users or groups. \
<b>A private Item will always remain private and cannot be  changed later.</b></li>  \
<li>If an Item is Shareable, an expiration date for sharing can be specified. \
The Item will disappear from recipient''s list after the specified date. Delete date to immediately expire \
the Item. \
Note that the expiration date will have effect only if the Item is shared with someone.</li></ul>

itemsSharedWithMeHelp=<ul style="padding-left:2px"> \
<li>To see the contents of an Item, click on the name of the Item. If the owner of an Item granted you update permission, you can edit it by clicking on <i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> Edit</span>.</li> \
<li>To relinquish Item(s), select the Item(s) by clicking on the CheckBoxes first. Then click on <i class="fa fa-chevron-circle-left" style="color:#F65D3C"></i><span style="color: #F65D3C;"> Relinquish</span>. \
You will be prompted to confirm relinquishing. </li>\
<li>Relinquished Item(s) will no longer be shared with you and you will not be able to access them. </li>  \
</ul>


shareWithUsersHelp=<ul style="padding-left:2px"> \
<li>To share the Item/Note, select the user(s) of interest by clicking on the checkBoxes. Then click on <i class="fa fa-share-alt-square" style="color:green"></i>&nbsp;<b style="color:green;">Share</b>. </li>  \
<li>A user can be searched for, based on full name. Enter a substring\/part of the full name in the search box and click <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. For example, if the user''s full name is Aqua Marine, \
entering qua in the search bar will display the user info. The user can be selected by clicking on the checkbox and then Share the Note\/Item using <i class="fa fa-share-alt-square" style="color:green"></i>&nbsp;<b style="color:green;">Share</b>.</li> \
<li>If the license does not support sending email notification, the toggle switch will be grayed out.</li>
</ul>

shareWithGroupsHelp=<ul style="padding-left:2px"> \
<li>To share the Item/Note, select the group(s) of interest by clicking on the checkBoxes. Then click on <i class="fa fa-share-alt-square" style="color:green"></i>&nbsp;<b style="color:green;">Share</b>&nbsp;button. </li>  \
<li>A group can be searched for, based on group name. Enter a substring\/part of the group name in the search box and click <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. For example, if the group name is ''Ride Share Friends'', \
entering ''share'' in the search bar will display the group info. The group can be selected by clicking on the checkbox and then Share the Note\/Item using <i class="fa fa-share-alt-square" style="color:green"></i>&nbsp;<b style="color:green;">Share</b>&nbsp;button. </li> \
</ul>

pickItemTypeHelp=<ul style="padding-left:2px"> \
<li>An Item can be created as a Note or as an instance of a personal\/global Template. </li> \
<li>It is also possible to create an Item as free format key\/value pairs using the Ad-Hoc selection. </li>  \
</ul>

grantPermissionsToUsersHelp=<ul style="padding-left:2px"> \
<li>There are two permissions that can be granted to another user. One is ''Update'' and the other is ''Own''. </li> \
<li>Update permission will allow the user to edit the Item or Note. Own permission will transfer the ownership to the other user. </li> \
<li>To grant a permission, check the right permission box and select the user(s) of interest by clicking on the checkBoxes. Then click on <i class="fa fa-check-circle" style="color:green"></i>&nbsp;<b style="color:green;">Grant</b>&nbsp;button. </li> \
</ul>

grantPermissionOnContainerHelp = <ul style="padding-left:2px"> \
<li>If ''Add/Modify Item'' permission is given to users, the users will be able to add and modify items in the container.</li> \
<li>If ''Own Container'' permission is given to users, only one of the users will be able to take ownership control of the container. A user has to <b>Take Ownership Control</b> from \
<b>Containers -&gt; Containers shared with me</b> screen. The first user that takes ownership will become the owner of the container. The original owner and the new owner can take the ownership control back and forth</li> \
</ul>

pickRevokeSharingHelp=<ul style="padding-left:2px"> \
<li>Revoke operation can be applied to sharing that was done to individual users or to groups. Pick the context of interest. </li>  \
</ul>


revokeItemFromUsersHelp=<ul style="padding-left:2px"> \
<li>To revoke Note/Item, select the users by clicking on the CheckBoxes. Then click on <i class="fa fa-ban" style="color:#F65D3C;"></i><span style="color: #F65D3C;"> Revoke</span>. \
Once revoked, users will no longer have access to the Note/Item. </li>  \
<li>Users of interest can also be selected by searching for them based on part\/substring of their name. </li> \
</ul>

revokeItemFromUsersGroupHelp=<ul style="padding-left:2px"> \
<li>To revoke Item, select a user or a group by clicking on the CheckBoxes. Then click on <i class="fa fa-ban" style="color:#F65D3C;"></i><span style="color: #F65D3C;"> Revoke</span>. \
Once revoked, the user or the users in the group will no longer have access to the Item. </li>  \
<li>Users ang Groups of interest can also be selected by searching for them based on part\/substring of their name. </li> \
</ul>

revokeItemSharedWithGroupsHelp=<ul style="padding-left:2px"> \
<li>To revoke Note/Item, select the groups by clicking on the CheckBoxes. Then click on <i class="fa fa-ban" style="color:#F65D3C;"></i><span style="color: #F65D3C;"> Revoke</span>. \
Once revoked, the groups will no longer have access to the Note\/Item. </li>  \
<li>A group of interest can also be selected by searching for them based on part\/substring of group name. </li> \
</ul>

selectItemTypeTemplateHelp=<ul style="padding-left:2px"> \
<li>Select the Template of interest by clicking on the CheckBox. Then click on <span style="background-color:#34ab24;border-radius:3px;">&nbsp;<b style="color:#ffffff;">Next-&gt</b> </span>. </li>  \
<li>A Template can also be found by searching for it by name. </li>  \
</ul>

shareContainerWithUsersHelp=<ul style="padding-left:2px"> \
<li>To share the Container, select the user(s) of interest by clicking on the checkBoxes. Then click on <i class="fa fa-share-alt-square" style="color:green"></i>&nbsp;<b style="color:green;">Share</b>. </li> \
<li>A user can be searched for, based on full name. Enter a substring\/part of the full name in the search box and click <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. For example, if the user''s full name is Aqua Marine, \
entering qua in the search bar will display the user info. The user can be selected by clicking on the checkbox and then Share the Container.</li> \
</ul>

shareContainerWithGroupsHelp=<ul style="padding-left:2px"> \
<li>To share the Container, select the group(s) of interest by clicking on the checkBoxes. Then click on <i class="fa fa-share-alt-square" style="color:green"></i>&nbsp;<b style="color:green;">Share</b>. </li> \
<li>A group can be searched for, based on group name. Enter a substring\/part of the group name in the search box and click <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. For example, if the group name is ''Yoga Friends'', \
entering yoga in the search bar will display the group info. Select the group by clicking on the checkbox and then Share the Container.</li> \
</ul>

revokeContainerSharingHelp = <ul style="padding-left:2px"> \
<li> To revoke container sharing from a user or a group, select the user or the group by clicking on the CheckBox. \
Then click on  <i class="fa fa-ban" style="color:#F65D3C;"></i><span style="color: #F65D3C;"> Revoke</span>.</li> \
<li>A user can be searched by the name. Enter a substring\/part of the full name in the search box and \
click <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. For example, if the user''s full name is Aqua Marine, \
entering qua in the search bar will display the user info. The user can be selected by clicking on the checkbox and then Revoke the Container.</li> \
<li>A group can be searched for, based on group name. Enter a substring\/part of the group name in the search box and click <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. For example, if the group name is ''Yoga Friends'', \
entering yoga in the search bar will display the group info. Select the group by clicking on the checkbox and then Revoke the Container.</li> \
</ul>

revokeContainerFromUsersHelp=<ul style="padding-left:2px"> \
<li>To revoke the Container, select the user(s) of interest by clicking on the checkBoxes. Then click on  <i class="fa fa-ban" style="color:#F65D3C;"></i><span style="color: #F65D3C;"> Revoke</span>. </li>\
<li>A user can be searched for, based on full name. Enter a substring\/part of the full name in the search box and click <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. For example, if the user''s full name is Aqua Marine, \
entering qua in the search bar will display the user info. The user can be selected by clicking on the checkbox and then Revoke the Container.</li> \
</ul>

revokeContainerFromGroupsHelp=<ul style="padding-left:2px"> \
<li>To revoke the Container, select the group(s) of interest by clicking on the checkBoxes. Then click on  <i class="fa fa-ban" style="color:#F65D3C;"></i><span style="color: #F65D3C;"> Revoke</span>. </li>\
<li>A group can be searched for, based on group name. Enter a substring\/part of the group name in the search box and click <span style="background-color:#0099ff;">&nbsp;<i class="fa fa-search" style="color:#ffffff;"></i> </span>. For example, if the group name is ''Yoga Friends'', \
entering yoga in the search bar will display the group info. Select the group by clicking on the checkbox and then Revoke the Container.</li> \
</ul>

listPersonalTemplatesHelp=<ul style="padding-left:2px"> \
<li>To see the fields in the Template, click on its name under <span style="font-weight:bold;">Template Name</span>. \
<i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> Edit</span> can be used to change the Name or fields or display order of the fields of a Template.</li>\
<li><i class="fa fa-copy" style="color:#F65D3C"></i><span style="color: #1E8CFF;"> Copy</span> can be used to copy a Template for further modifications or adaptations. \
To delete a Template, select it and click on <i class="fa fa-times-circle" style="color:red"></i><span style="border-radius:3px;color:#ff0000;font-weight:bold;">&nbsp;Delete</span>. </li> \
<li>When a Template is deleted, existing Items created using that Template are preserved. The Template itself will be removed from further use.</li></ul>

listGlobalTemplatesHelp=<ul style="padding-left:2px"> \
<li>To see the fields in the Template, click on its name under <span style="font-weight:bold;">Template Name</span>. \
<i class="fa fa-edit" style="color:green"></i><span style="color: #1E8CFF;"> Edit</span> can be used to change the Name or fields or display order of the fields of a Template.</li>\
<li><i class="fa fa-copy" style="color:#F65D3C"></i><span style="color: #1E8CFF;"> Copy</span> can be used to copy a Template for further modifications or adaptations. \
To delete a Template, select it and click on <i class="fa fa-times-circle" style="color:red"></i><span style="border-radius:3px;color:#ff0000;font-weight:bold;">&nbsp;Delete</span>. </li> \
<li>When a Template is deleted, existing Items created using that Template are preserved. The Template itself will be removed from further use.</li></ul>

containersSharedWithMeHelp=<ul style="padding-left:2px"> \
<li>To list the Items in a Container, click on its name. The <span style="font-weight: bold">Shared By</span> column lists the person who shared the Container with you. </li> \
<li>To relinquish Container(s), first select the Container(s) using CheckBoxes. Then click on <i class="fa fa-chevron-circle-left" style="color:#F65D3C"></i><span style="color: #F65D3C;"> Relinquish</span>. \
You will be prompted to confirm relinquishment. Once relinquished, you will not have access to the Container(s).</li> \
</ul>


