whatIsIt = About Obidos
aboutObidos = <div class=\"row\"> \
<div class="col-md-12 col-xs-12 col-centered"> \
	<ul class=\"list-group\"> \
		<li class=\"list-group-item\">\
			&#8226; <a href=\"https://spenego.com">Obidos from Spenego</a> \
			provides a way to <b>store</b> sensitive information (eg: Passwords, Credit Card Info, passports, social security number, documents, audio, video, 2FA secrets, anything digital) <b>securely</b> \
			and to <b>share</b> the information <b>securely</b>. All information is encrypted \
			using the best in class crypto libraries.<br/></li>\
		<li class=\"list-group-item\">\
			&#8226; Information can be shared with a single user or a group. \
			Different types of information can be put in a <span style="font-weight:bold;">Container</span> and the Container \
			can be shared as well. \
			The owner of information can delegate ownership to other users. \
			The owner also can revoke sharing. \
			The shared information can have an optional lifetime. </li> \
		<li class=\"list-group-item\">\
			&#8226; Obidos admins do not have access to user keys or encrypted data. Admins can  \
			only manage user accounts. \
			</li> \
	</ul> \
</div>  \
</div> \

