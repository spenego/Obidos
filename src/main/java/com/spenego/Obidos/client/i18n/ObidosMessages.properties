containersMenuHelpTitle=Containers
containersMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">Containers</font></b></div></p> \
<p>A Container holds Items. A Container can be Private or Shareable. Only Private Items can be stored in a Private Container. \
The Items in a Private Container stay hidden from other users. \
A Shareable Container can have both Private and Shareable Items. \
When a Shareable Container is shared with others, only the Shareable Items in the Container will be visible to them. \
<p>Each screen has screen-speific help that can be accessed by clicking on <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-info-circle" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;Help&nbsp</span></span> button at the top right of the panel. \
Once you navigate to a down level screen, to return to the previous screen, use the <span style="background-color:blue; color:#FFFFFF">&nbsp;\
<i class="fa fa-arrow-circle-left" style="color:#FFFFFF"></i><span style="background-color: blue; color: #FFFFFF;">&nbsp;Back&nbsp</span></span> button at the top left of the panel. </p>\
<p>Navigation through the listing menus are similar and described here. \
By default, the Containers will be displayed in the order in which they were created with the latest one at the top. \
To sort the list of Containers in another order, click on <i class="fa fa-sort" style="color:#1E8CFF"></i><span style="color: #1E8CFF;">&nbsp;Sort</span> icon above the list bar. \
At the bottom of the screen it will be shown as to how many Containers exist. \
For example if there are 20 Containers and 14 are listed in the current screen, at the bottom of the screen you will see \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> 1-14 of 20 <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
In order to move forward in the list one at a time, click on <img src="/images/simplePagerNextPage.png">. \
To move forward a complete page, click on <img src="/images/simplePagerLastPage.png">. \
Similary, to go back in the list one at a time, click on <img src="/images/simplePagerPreviousPage.png"> \
and to go back one complete page, click on <img src="/images/simplePagerFirstPage.png">. \
To see the Items in a Container, click on its name. </p>\
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">Create New Container</font></b></span></p> \
<p><b><font color="blue">Create New Container</font></b> menu is used to create a Container. A name can be assigned to the Container. \
This name can be used in search to find a specific Container from the collection of all Containers owned by the user. </p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">My Containers</font></b></span></p> \
<p><b><font color="blue">My Containers</font></b> menu is used to get a listing of all Containers owned by the user. \
To see the list of users/groups to whom the Container was shared, click on <i class="fa fa-users" style="color:#1E8CFF"></i> <span style="color: #1E8CFF;">List</span>. </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">My Containers Shared With Others</font></b></span></p> \
<p><b><font color="blue">My Containers shared with others</font></b> menu lists all Containers that were shared with other users/groups. \
Navigating through the list is similar to the navigation details outlined under the "My Containers" menu. </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">Containers shared with me</font></b></span></p> \
<p><b><font color="blue">Containers shared with me</font></b> menu lists all Items that others shared with the user.</p> \
</span>

templatesMenuHelpTitle=Templates
templatesMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">Templates</font></b></div></p> \
<p>A Template describes the layout of an Item. Each Template is made up of multiple &lt;field,value&gt; pairs.  There can be any number of fields and they are used as a guide to create Items. \
For example, a Template called "Email Account" can have fields "url", "username" and "password". \
<p> When a Template is used to create an Item, the predefined fields will be presented and the user \
just has to provide values for those fields. \
For example, \
when the "Email account" Template is used to create an Item called "Personal eMail", values for the fields \
url, username, and password have to be supplied by the user. \
<p>Templates can be Global or Personal. The fields of a Personal Template have to be defined by the user. \
It is also possible to copy a Global Template to a Personal Template for customizations. \
Users can create/modify/delete their Personal Templates. \
Obidos comes with a number of predefined Global Templates. \
Only users with permissions can create/modify/delete Global Templates.</p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">Create New Personal Template</font></b></span></p> \
<p><b><font color="blue">Create New Personal Template</font></b> menu is used to create a new Personal Template. A name can be assigned to the Template. \
This name can be used in search to find a specific Template from the collection of all Personal Templates owned by the user. </p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">Personal Templates</font></b></span></p> \
<p><b><font color="blue">Personal Templates</font></b> menu is used to get a listing of all Personal Templates  owned by the user. \
The Templates will be displayed in the order in which they were created with the latest one at the top. \
At the bottom of the screen it will be shown as to how many Templates exist. \
For example if there are 17 Personal Templates and 14 are listed in the screen, you will see \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> 1-14 of 17 <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
<p>In order to move forward in the list one at a time, click on <img src="/images/simplePagerNextPage.png">. \
To move forward a complete page of Templates, click on <img src="/images/simplePagerLastPage.png">. \
Similary, to go back in the list one Template at a time, click on <img src="/images/simplePagerPreviousPage.png"> \
and to go back one complete page of Templates, click on <img src="/images/simplePagerFirstPage.png">. </p> \
</span>
groupsMenuHelpTitle=Groups
groupsMenuHelp=<span><p><div style="font-size: 135%; text-align: center;"><b><font color="#BC3503">Groups</font></b></div></p> \
<p>Users can create Groups of users. Groups will make it easy to share a Note or Item/Container with multiple users. \
Only users can be added as members of a Group. Another Group cannot be added as a member of a Group. </p> \
<p><span style="text-decoration: underline; font-size: 110%"><b><font color="#BC3503">Create New Group</font></b></span></p> \
<p><b><font color="blue">Create New Group</font></b> menu is used to create a new Group of users. A name can be assigned to the Group. \
This name can be used in search to find a specific Group from the collection of all Groups owned by the user. </p> \
<p><span style="text-decoration: underline; font-size: 110%;"><b><font color="#BC3503">My Groups</font></b></span></p> \
<p><b><font color="blue">My Groups</font></b> menu is used to get a listing of all Groups owned by the user. \
The Groups will be displayed in the order in which they were created with the latest one at the top. \
At the bottom of the screen it will be shown as to how many Groups exist. \
For example if there are 17 Groups and 14 are listed in the screen, you will see \
<div style="text-align: center;"><p><img src="/images/simplePagerFirstPageDisabled.png"> <img src="/images/simplePagerPreviousPageDisabled.png"> 1-14 of 17 <img src="/images/simplePagerNextPage.png"> <img src="/images/simplePagerLastPage.png"></p></div> \
<p>In order to move forward in the list one at a time, click on <img src="/images/simplePagerNextPage.png">. \
To move forward a complete page of Groups, click on <img src="/images/simplePagerLastPage.png">. \
Similary, to go back in the list one Group at a time, click on <img src="/images/simplePagerPreviousPage.png"> \
and to go back one complete page of Groups, click on <img src="/images/simplePagerFirstPage.png">. </p> \
</span>

