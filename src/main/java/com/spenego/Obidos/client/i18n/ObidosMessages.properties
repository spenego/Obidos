editAccountCreatedNotificationTemplateHelp = Notification email contains two attachments. \
One is responsive HTML and the other is text. The HTML attachment is for HTML based email readers \
and the text attachment is for the text based mail readers. \
<ul style="padding-left:2px"><li><b>Subject</b>: The text in this TextBox will appear as subject in the email</li> \
<li><b>Hello</b>: The text in the TextBox will be used to address the user. The tag '{{'name'}}' will be replaced with the user''s Fullname</li> \
<li>The text in <b>HTML Message</b> TextArea will be used as the main message in the responsive HTML attachment. However, do not use \
any HTML tags in the message as they will be escaped for security reasons.</li> \
<li>The text in the <b>Button Title</b> TextBox will appear as the title of the button in responsive HTML mail</li> \
<li>The text in <b>Help</b> TextArea is help text for the HTML based mail reader if it has problem on clicking on the button</li> \
<li>The text in <b>Text Message</b> TextArea will be used in the text attachment for text mail readers</li> \
<li>The text in <b>Contact</b> TextArea is for letting the user know how to contact Tech Support etc.</li> \
<li>The text in <b>Footer</b> can be company information etc. </li></ul>
