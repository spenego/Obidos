<li>Obidos can securely check passwords against <a href="https://haveibeenpwned.com/Passwords" target="_blank">HaveIBeenPwned.com</a>, \
a free service listing over half a billion hacked/stolen passwords to see if a password was ever compromised</li>\
<li>Please note, the password is never sent to HaveIBeenPwned.com. \
A technique called <a href="https://blog.cloudflare.com/validating-leaked-passwords-with-k-anonymity/" target="_blank">k-Anonymity</a> is used to check a password without disclosing the password itself. \
Network connection will be required</li>\
<li>We consider adjusted entropy 0-19 is Weak, 20-24 is Moderate, 25-29 Strong and 30+ is Very Strong. Please click on the Info button for more info.</li>
</ul>

