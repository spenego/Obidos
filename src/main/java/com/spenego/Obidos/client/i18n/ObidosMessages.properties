editAdminHelp = <ul style="padding-left:2px"> \
<li>Updating an account will fail if you do not have needed capabilities. Please look at \
your capabilities from <b>login > My Capabilities</b> menu item at the far \
right side of the Navigation bar.</li> \
<li>Please note that turning on all capabilities does not make an admin a <b>root Admin</b>, it has to \
be set explicitly by turning on <b>Promote to root Admin</b> switch</li> \
<li>Only a root admin can edit another root Admin''s information</li> \
<li>username and password can be updated only if \
<b>Change Admin Credentials</b> capability is set</li> \
<li>Only a root Admin can change other admin''s capabilities</li> \
<li>If <b>Promote to root Admin</b> is disabled, that means the admin is already a root Admin</li> \
</ul>

uploadProfilePicHelp = <ul style="padding-left:2px"> \
<li>In order to set a profile picture, please upload an image first.</li> \
<li>Then select the region of the image you want to set as your profile picture.</li> \
<li>Apply any filter on the selected region if desired. Then click on the <b>Crop</b> button. The profile picture will be set as thumbnail at the top rectangle.</li> \
<li>If you want to annotate the picture with text, click at a location on the thumbnail of \
the picture, type the text, select color and the click on <b>Annotate</b> button.</li> \
<li>If satisfied, click on <b>Save</b> button.</li>\
<li>The profile picture will show up if you visit <b>Edit Profile</b> page by clicking on the email at the top right corner of the nav bar.</li>\
<li>If you share any item with someone, the sharee will be able to view the profile picture by clicking on your full name.</li>\
</ul>

