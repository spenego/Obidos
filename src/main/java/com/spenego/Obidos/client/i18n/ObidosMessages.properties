is supported for resetting Password and Passphrase. </li>\
<li> TOTP requires the use of one of the free \
Authenticator apps Google Authenticator or Authy or Microsoft Authenticator \
 on iOS/Android phone.</li>\
<li>Enabling 2FA is a 4 steps process:</li>\
<ol>\
<li>Download and install Google Authenticator or Authy or Microsoft Authenticator app in your Phone.</li>\
<li>Generate a Secret by clicking on <span style="border-radius:3px;background-color:#169c39;color:#ffffff;font-weight:bold;">&nbsp;&nbsp;Generate Secret for 2FA &nbsp;</span>. The Secret will be stored securely in the server.</li> \
<li>Add the Secret displayed here in Obidos to the Authenticator App in your Phone.</li> \
<li>Finally, enter the numeric Code shown on the Authenticator App over here. If the Code is valid, 2FA will be enabled.</li>\
</ol>\
</ul>
