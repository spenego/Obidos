createAdminHelp = <ul style="padding-left:2px"> \
<li>Username can contain uppercase, lowercase, number, _, - and .</li> \
<li>Every admin will be able to perform all actions under the ''Settings'' menu. Similarly every admin will be able to change profile information of a user or admin. However, changing the credentials (username,password,2FA) of a user or admin requires the capability ''Modify credentials''.</li> \
<li> A <span style="font-weight:bold">root Admin</span> is \
a special type of admin who has full capabilities to manage \
user and admin accounts. Only a <span style="font-weight:bold">root Admin</span> can manage all capabilities for new \
admin account or can create another <span style="font-weight:bold">root Admin</span> account. \
Just turning on all capabilities under &#8220;New admin''s capabilities&#8221; do not make make an admin a \
<span style="font-weight:bold">root Admin</span>. </li> \
<li>In order to create a <span style="font-weight:bold">root Admin</span> account, turn on the \
<span style="font-weight:bold">Create as Root Admin</span> value. </li> \
</ul>

listUsersHelp = <ul style="padding-left:2px"> \
